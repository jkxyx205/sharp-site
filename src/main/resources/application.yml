spring:
  application:
    name: sharp-site
  datasource:
    url: ${JDBC.URL}
    username: ${JDBC.USERNAME}
    password: ${JDBC.PASSWORD}
  config:
    import:
      - optional:classpath:.env.postgres.properties
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  mail: # SMTP 发邮件
    host: smtp.163.com
    port: 25
    username: ${EMAIL.USERNAME}
    password: ${EMAIL.PASSWORD} # 将邮箱开启smtp服务后获取的授权码作为密码；https://help.mail.163.com/faqDetail.do?code=d7a5dc8471cd0c0e8b4b8f4f8e49998b374173cfe9171305fa1ce630d7f67ac21b8ba4d48ed49ebc
    default-encoding: UTF-8
    imap: # IMAP 收邮件
      host: imap.163.com
      port: 143
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# sharp-database 必备配置：type 须与实际库一致；entity-base-package 未配置会启动 NPE
sharp:
  database:
    type: PostgreSQL
    entity-base-package: com.rick.site.**.entity
  site:
    www-root: /Users/rick/Space/tmp/site/www

# sharp-fileupload 本地存储（开发默认值，Phase 8 媒体管理时再按需调整 / 对接 OSS）
fileupload:
  tmp: /Users/rick/Space/tmp/site/tmp # 下载的临时目录
  local: # cd /Users/rick/Space/tmp/fileupload && http-server -p 7892
    root-path: /Users/rick/Space/tmp/site/upload
    server-url: http://site.xhope.top/upload/ # 映射到tmp目录

logging:
  level:
    root: INFO
    com.rick.site: DEBUG

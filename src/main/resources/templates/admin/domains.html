<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head(title='域名管理')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{admin/fragments/layout :: sidebar(active='domains')}"></aside>
    <div class="main">
        <header th:replace="~{admin/fragments/layout :: topbar()}"></header>
        <main class="content">
            <h1>域名管理</h1>
            <p class="error" th:if="${error}" th:text="${error}">错误</p>

            <div class="card">
                <h1 style="font-size:15px;">添加域名</h1>
                <form class="filter" method="post" th:action="@{/admin/domains}">
                    <input type="text" name="domain" placeholder="例如 www.example.com" required />
                    <label><input type="checkbox" name="primary" /> 设为主域名</label>
                    <button type="submit" class="btn btn-primary">添加域名</button>
                </form>
            </div>

            <div class="card">
                <table>
                    <thead>
                    <tr><th>域名</th><th>类型</th><th>状态</th><th>操作</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="d : ${domains}">
                        <td th:text="${d.domain}">example.com</td>
                        <td>
                            <span th:if="${d.isPrimary != null and d.isPrimary == 1}" class="tag tag-primary">主域名</span>
                            <span th:if="${d.isPrimary == null or d.isPrimary != 1}" class="tag tag-secondary">普通</span>
                        </td>
                        <td>
                            <span th:if="${d.status != null and d.status == 1}">启用</span>
                            <span th:if="${d.status == null or d.status != 1}">停用</span>
                        </td>
                        <td>
                            <form method="post" style="display:inline"
                                  th:action="@{/admin/domains/{id}/primary(id=${d.id})}"
                                  th:if="${d.isPrimary == null or d.isPrimary != 1}">
                                <button type="submit" class="btn-link">设为主域名</button>
                            </form>
                            <form method="post" style="display:inline"
                                  th:action="@{/admin/domains/{id}/delete(id=${d.id})}"
                                  onsubmit="return confirm('删除该域名?');">
                                <button type="submit" class="btn-link danger">删除</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <p class="empty" th:if="${domains == null or domains.isEmpty()}">暂无域名,添加一个以发布站点。</p>
            </div>
        </main>
    </div>
</div>
</body>
</html>

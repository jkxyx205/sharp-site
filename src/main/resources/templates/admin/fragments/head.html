<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- 后台公共 <head>:meta + 标题 + shadcn 风内联样式。
     CSS 变量定义调色板(深浅自适应),布局类(.shell/.sidebar/.main/.topbar/.content)
     与组件类(.card/.btn/table/fieldset/...)供所有 admin 页面复用。 -->
<head th:fragment="head(title)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title} + ' · Admin'">Admin</title>
    <style>
        :root {
            --bg: #f4f4f5;            /* zinc-100 页面底 */
            --card: #ffffff;          /* 卡片 */
            --border: #e4e4e7;        /* zinc-200 细边框 */
            --fg: #18181b;            /* zinc-900 正文 */
            --muted: #71717a;         /* zinc-500 次要文字 */
            --muted-bg: #f4f4f5;      /* zinc-100 次要底 */
            --primary: #18181b;      /* zinc-900 主按钮(中性) */
            --primary-fg: #fafafa;    /* 主按钮文字 */
            --sidebar: #fafafa;       /* 侧栏底 */
            --danger: #dc2626;
            --radius: 8px;
            --ring: #d4d4d8;
        }
        @media (prefers-color-scheme: dark) {
            :root:not(.light) {
                --bg: #09090b; --card: #18181b; --border: #27272a;
                --fg: #fafafa; --muted: #a1a1aa; --muted-bg: #27272a;
                --primary: #fafafa; --primary-fg: #18181b;
                --sidebar: #0c0c0e; --danger: #f87171; --ring: #3f3f46;
            }
        }
        * { box-sizing: border-box; }
        body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               background: var(--bg); color: var(--fg); margin: 0; font-size: 14px; line-height: 1.5; }
        a { color: inherit; }

        /* ===== 布局骨架 ===== */
        .shell { display: flex; min-height: 100vh; }
        .sidebar { width: 224px; flex: 0 0 224px; background: var(--sidebar);
                   border-right: 1px solid var(--border); padding: 16px 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
        .sidebar .brand { font-weight: 700; font-size: 15px; padding: 4px 20px 16px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
        .nav-group { padding: 8px 8px 4px; }
        .nav-group > .nav-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
                                  color: var(--muted); padding: 6px 12px; }
        .nav-group a { display: block; padding: 7px 12px; border-radius: 6px; color: var(--fg);
                       text-decoration: none; margin: 1px 0; font-size: 13px; }
        .nav-group a:hover { background: var(--muted-bg); }
        .nav-group a.active { background: var(--muted-bg); font-weight: 600; }
        .sidebar .spacer { flex: 1; }
        .sidebar .foot { padding: 8px 20px; border-top: 1px solid var(--border); margin-top: 8px; }
        .sidebar .foot a { font-size: 13px; color: var(--muted); text-decoration: none; }
        .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
        .topbar { height: 56px; display: flex; align-items: center; justify-content: space-between;
                  padding: 0 24px; border-bottom: 1px solid var(--border); background: var(--card);
                  position: sticky; top: 0; z-index: 10; gap: 12px; }
        .topbar .who { font-size: 13px; color: var(--muted); }
        .topbar .who strong { color: var(--fg); }
        .topbar .actions { display: flex; gap: 8px; align-items: center; }
        .content { padding: 24px; max-width: 960px; width: 100%; margin: 0 auto; }

        /* ===== 组件 ===== */
        h1 { font-size: 18px; font-weight: 700; margin: 0 0 16px; }
        .subnav { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
        .subnav a, .subnav .btn { margin: 0; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
                padding: 24px; margin: 0 0 16px; }
        .error { color: var(--danger); margin-bottom: 12px; font-size: 13px; }
        .hint { color: var(--muted); font-size: 12px; font-weight: 400; }
        .empty { color: var(--muted); padding: 24px 0; text-align: center; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
        th { background: transparent; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }

        form { font-size: 14px; }
        label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 13px; }
        input[type=password], input[type=text], input[type=url], input[type=number], input[type=email], input[type=datetime-local], select, textarea {
            width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
            font: inherit; background: var(--card); color: var(--fg); box-sizing: border-box; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 35%, transparent); }
        textarea { min-height: 120px; resize: vertical; }
        .row { display: flex; gap: 8px; align-items: center; }
        fieldset { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin: 16px 0; }
        legend { font-weight: 700; padding: 0 6px; font-size: 13px; }
        .lang-tag { font-size: 11px; color: var(--muted); font-weight: 400; }
        .default-lang { background: var(--muted-bg); }

        .btn { display: inline-flex; align-items: center; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border);
                background: var(--card); color: var(--fg); font-size: 13px; cursor: pointer; text-decoration: none; line-height: 1; }
        .btn:hover { background: var(--muted-bg); }
        .btn-primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
        .btn-primary:hover { background: var(--primary); opacity: .9; }
        .btn-secondary { background: var(--card); }
        .btn-link { background: none; border: none; color: var(--danger); padding: 2px 6px; font-size: 13px; cursor: pointer; }
        .actions { margin-top: 20px; display: flex; gap: 8px; }
        .filter { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
        .filter select { width: auto; min-width: 200px; }
        .filter label { margin: 0; font-weight: 600; font-size: 13px; }

        /* 仪表盘统计卡 */
        .stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
        .stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; min-width: 180px; flex: 1 1 180px; }
        .stat .num { font-size: 30px; font-weight: 700; }
        .stat .lbl { color: var(--muted); font-size: 13px; margin-top: 4px; }

        /* 标签(域名类型) */
        .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .tag-primary { background: #dcfce7; color: #16a34a; }
        .tag-secondary { background: var(--muted-bg); color: var(--muted); }
        @media (prefers-color-scheme: dark) {
            :root:not(.light) .tag-primary { background: rgba(22,163,74,.18); color: #4ade80; }
        }

        /* 发布状态 */
        .status-SUCCESS { color: #16a34a; font-weight: 600; }
        .status-FAILED { color: var(--danger); font-weight: 600; }
        .status-PENDING, .status-RUNNING { color: #d97706; font-weight: 600; }
        @media (prefers-color-scheme: dark) {
            :root:not(.light) .status-SUCCESS { color: #4ade80; }
            :root:not(.light) .status-PENDING, :root:not(.light) .status-RUNNING { color: #fbbf24; }
        }
    </style>
</head>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- 后台公共 <head>:meta + 标题 + admin 内联样式。
     供新 admin 页面 th:replace 复用,统一外观;既有 admin 页保持独立(未重构)。 -->
<head th:fragment="head(title)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title} + ' · Admin'">Admin</title>
    <style>
        body { font-family: system-ui, sans-serif; background:#f5f5f5; margin:0; padding:40px; }
        .card { max-width:820px; margin:20px auto; background:#fff; padding:24px; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.12); }
        h1 { font-size:20px; margin:0 0 16px; }
        .meta { color:#555; font-size:14px; margin-bottom:12px; }
        nav a, .card a { margin-right:16px; color:#2563eb; }
        table { width:100%; border-collapse:collapse; font-size:14px; margin:8px 0; }
        th, td { text-align:left; padding:8px; border-bottom:1px solid #eee; }
        th { background:#fafafa; }
        .empty { color:#888; }
        form { font-size:14px; }
        label { display:block; margin:8px 0 4px; font-weight:600; color:#333; }
        input[type=text], input[type=url], input[type=number], input[type=datetime-local], select, textarea {
            width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; font:inherit; box-sizing:border-box;
        }
        textarea { min-height:120px; resize:vertical; }
        .btn { display:inline-block; padding:8px 16px; border-radius:4px; border:none; background:#2563eb; color:#fff; font-size:14px; cursor:pointer; text-decoration:none; }
        .btn:hover { opacity:.9; }
        .btn-link { background:none; color:#d11; padding:2px 6px; }
        .btn-secondary { background:#6b7280; }
        .row { display:flex; gap:8px; align-items:center; }
        fieldset { border:1px solid #ddd; border-radius:6px; padding:12px 16px; margin:16px 0; }
        legend { font-weight:700; padding:0 6px; }
        .lang-tag { font-size:.8em; color:#6b7280; font-weight:400; }
        .default-lang { background:#eef2ff; }
        .actions { margin-top:16px; display:flex; gap:8px; }
        .error { color:#d11; margin-bottom:8px; }
        .hint { color:#888; font-size:12px; font-weight:400; }
    </style>
</head>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- 后台共享布局片段:sidebar(active) 左侧菜单 + topbar() 顶栏常驻操作。
     各 admin 页面 th:replace 引入;active 控制菜单高亮。菜单静态写死(结构固定)。 -->
<body>

<!-- 左侧菜单 -->
<aside class="sidebar" th:fragment="sidebar(active)">
    <div class="brand">Sharp 站点管理</div>
    <div class="nav-group">
        <div class="nav-label">首页</div>
        <a th:href="@{/admin/}" th:classappend="${active == 'home'} ? 'active' : ''">首页</a>
    </div>
    <div class="nav-group">
        <div class="nav-label">基本信息</div>
        <a th:href="@{/admin/company}" th:classappend="${active == 'company'} ? 'active' : ''">公司信息</a>
        <a th:href="@{/admin/seo}" th:classappend="${active == 'seo'} ? 'active' : ''">SEO信息</a>
        <a th:href="@{/admin/domains}" th:classappend="${active == 'domains'} ? 'active' : ''">域名管理</a>
    </div>
    <div class="nav-group">
        <div class="nav-label">内容维护</div>
        <a th:href="@{/admin/media}" th:classappend="${active == 'media'} ? 'active' : ''">素材管理</a>
        <a th:href="@{/admin/categories}" th:classappend="${active == 'categories'} ? 'active' : ''">分类管理</a>
        <a th:href="@{/admin/news}" th:classappend="${active == 'news'} ? 'active' : ''">新闻中心</a>
        <a th:href="@{/admin/products}" th:classappend="${active == 'products'} ? 'active' : ''">产品管理</a>
    </div>
    <div class="nav-group">
        <div class="nav-label">网站发布</div>
        <a th:href="@{/admin/publish}" th:classappend="${active == 'media'} ? 'active' : ''">版本管理</a>
    </div>
    <div class="spacer" style="flex:1"></div>
    <div class="foot">
        <form th:action="@{/admin/logout}" method="post" style="display:inline;margin:0">
            <button type="submit" style="font:inherit;font-size:13px;color:inherit;background:none;border:0;padding:0;cursor:pointer">退出</button>
        </form>
    </div>
</aside>

<!-- 顶栏:常驻 网站预览 / 网站发布 -->
<header class="topbar" th:fragment="topbar()">
    <div class="who">
        已登录:<strong th:text="${username}">admin</strong>
        · 租户:<strong th:text="${tenantName}">—</strong>
    </div>
    <div class="actions" style="margin-top: 0">
        <a class="btn" th:href="@{/preview/}" target="_blank">网站预览</a>
<!--        <a class="btn btn-primary" th:href="@{/admin/publish}">网站发布</a>-->
        <form method="post" th:action="@{/admin/publish}" style="display:inline">
            <button type="submit" class="btn btn-primary">发布新版本</button>
        </form>
    </div>
</header>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head(title='首页区块')}"></head>
<body>
<div class="card">
    <h1>首页区块</h1>
    <nav><a th:href="@{/admin/}">← 返回</a> <a th:href="@{/admin/home-sections/new}">+ 新建区块</a></nav>
    <p class="error" th:if="${error}" th:text="${error}">错误</p>
    <table>
        <thead>
        <tr><th>Section Key</th><th>排序</th><th>启用</th><th>操作</th></tr>
        </thead>
        <tbody>
        <tr th:each="s : ${sections}">
            <td th:text="${s.sectionKey}">key</td>
            <td th:text="${s.sort}">0</td>
            <td th:text="${s.enabled == 1 ? '是' : '否'}">—</td>
            <td>
                <a th:href="@{/admin/home-sections/{id}/edit(id=${s.id})}">编辑</a>
                <form th:action="@{/admin/home-sections/{id}/delete(id=${s.id})}" method="post" style="display:inline"
                      onsubmit="return confirm('删除该区块?');">
                    <button type="submit" class="btn-link">删除</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${sections == null or sections.isEmpty()}">暂无区块。</p>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin</title>
    <style>
        body { font-family: system-ui, sans-serif; background:#f5f5f5; margin:0; padding:40px; }
        .card { max-width:640px; margin:20px auto; background:#fff; padding:24px; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.12); }
        h1 { font-size:20px; margin:0 0 16px; }
        .meta { color:#555; font-size:14px; margin-bottom:12px; }
        nav a { margin-right:16px; color:#2563eb; }
    </style>
</head>
<body>
<div class="card">
    <h1>后台首页</h1>
    <p class="meta">已登录:<strong th:text="${username}">admin</strong> · 租户:<strong th:text="${tenantName}">—</strong>(ID <span th:text="${tenantId}">—</span>)</p>
    <nav>
        <a th:href="@{/admin/products}">产品管理</a>
        <a th:href="@{/admin/publish}">网站发布</a>
        <a th:href="@{/admin/domains}">域名管理</a>
        <a th:href="@{/preview/}" target="_blank">预览站点</a>
        <a th:href="@{/admin/logout}">退出</a>
    </nav>
</div>
</body>
</html>

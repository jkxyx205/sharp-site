<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head(title='首页')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{admin/fragments/layout :: sidebar(active='home')}"></aside>
    <div class="main">
        <header th:replace="~{admin/fragments/layout :: topbar()}"></header>
        <main class="content">
            <h1>仪表盘</h1>
            <div class="card">
                <h1>当前租户</h1>
                <table>
                    <tr><th>租户名称</th><td th:text="${tenantName}">—</td></tr>
                    <tr><th>主题</th><td th:text="${themeId}">—</td></tr>
                    <tr><th>状态</th><td>
                        <span class="tag" th:classappend="${tenantStatusTag}"
                              th:text="${tenantStatusLabel}">—</span>
                    </td></tr>
                    <tr th:if="${tenantId != null}"><th>租户 ID</th><td th:text="${tenantId}">—</td></tr>
                    <tr th:if="${tenantSiteUrl != null and !tenantSiteUrl.isEmpty()}">
                        <th>线上站点</th>
                        <td><a th:href="${tenantSiteUrl}" th:text="${tenantSiteUrl}" target="_blank" rel="noopener">—</a></td>
                    </tr>
                </table>
            </div>
            <div class="stats">
                <div class="stat">
                    <div class="num" th:text="${articleCount}">0</div>
                    <div class="lbl">已发布文章</div>
                </div>
                <div class="stat">
                    <div class="num" th:text="${productCount}">0</div>
                    <div class="lbl">上架产品</div>
                </div>
                <div class="stat">
                    <div class="num" th:text="${videoCount}">0</div>
                    <div class="lbl">已发布视频</div>
                </div>
            </div>

            <div class="card">
                <h1>快捷入口</h1>
                <div class="subnav">
                    <a class="btn" th:href="@{/admin/products}">产品中心</a>
                    <a class="btn" th:href="@{/admin/videos}">视频中心</a>
                    <a class="btn" th:href="@{/admin/news}">新闻中心</a>
                    <a class="btn" th:href="@{/admin/categories}">分类管理</a>
                    <a class="btn" th:href="@{/admin/company}">公司信息</a>
                    <a class="btn" th:href="@{/admin/seo}">SEO信息</a>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head(title='登录')}"></head>
<body>
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;">
    <div class="card" style="max-width:360px; width:100%; margin:0;">
        <h1 style="text-align:center;">Sharp 站点管理</h1>
        <p class="error" th:if="${param.error != null}">用户名或密码错误。</p>
        <p class="error" th:if="${param.logout != null}">已退出登录。</p>
        <form th:action="@{/admin/login}" method="post">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" required />
            <label for="password">密码</label>
            <input type="password" id="password" name="password" required />
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="actions">
                <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">登录</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>
    <style>
        body { font-family: system-ui, sans-serif; background:#f5f5f5; margin:0; padding:40px; }
        .card { max-width:360px; margin:40px auto; background:#fff; padding:28px; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.12); }
        h1 { font-size:20px; margin:0 0 20px; }
        label { display:block; font-size:13px; margin:12px 0 4px; color:#555; }
        input[type=text], input[type=password] { width:100%; padding:8px; box-sizing:border-box; border:1px solid #ccc; border-radius:4px; }
        button { width:100%; margin-top:18px; padding:9px; background:#2563eb; color:#fff; border:0; border-radius:4px; cursor:pointer; }
        .error { color:#dc2626; font-size:13px; margin-top:12px; }
    </style>
</head>
<body>
<div class="card">
    <h1>Admin Login</h1>
    <div class="error" th:if="${param.error != null}">用户名或密码错误。</div>
    <div class="error" th:if="${param.logout != null}">已退出登录。</div>
    <form th:action="@{/admin/login}" method="post">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" required />
        <label for="password">密码</label>
        <input type="password" id="password" name="password" required />
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit">登录</button>
    </form>
</div>
</body>
</html>

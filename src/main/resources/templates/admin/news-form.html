<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head(title='文章编辑')}"></head>
<body>
<div class="card">
    <h1><span th:text="${article.id == null ? '新建文章' : '编辑文章'}">文章</span></h1>
    <nav><a th:href="@{/admin/news}">← 返回列表</a></nav>
    <p class="error" th:if="${error}" th:text="${error}">错误</p>
    <form th:action="@{/admin/news/save}" method="post">
        <input type="hidden" name="id" th:value="${article.id}" />
        <label>Slug <span class="hint">租户内唯一 URL 标识</span>
            <input type="text" name="slug" th:value="${article.slug}" required placeholder="company-launched" /></label>
        <label>分类
            <select name="categoryId">
                <option value="">— 无 —</option>
                <option th:each="c : ${categories}" th:value="${c.id}"
                        th:selected="${article.categoryId != null && article.categoryId == c.id}"
                        th:text="${c.slug}">category</option>
            </select></label>
        <label>Cover URL
            <input type="url" name="cover" th:value="${article.cover}" placeholder="/img/news.jpg" /></label>
        <label>作者
            <input type="text" name="author" th:value="${article.author}" /></label>
        <label>发布时间
            <input type="datetime-local" name="publishTime" th:value="${article.publishTime}" /></label>
        <label>排序 <span class="hint">升序</span>
            <input type="number" name="sort" th:value="${article.sort}" /></label>
        <label>Status
            <select name="status">
                <option value="1" th:selected="${article.status == 1}">发布</option>
                <option value="0" th:selected="${article.status != 1}">草稿</option>
            </select></label>

        <th:block th:each="lang : ${languages}">
            <fieldset th:classappend="${lang == defaultLanguage ? 'default-lang' : ''}">
                <legend><span th:text="${lang}">语言</span>
                    <span class="lang-tag" th:if="${lang == defaultLanguage}">· 默认语言</span></legend>
                <label>Title <span class="hint">必填,空则不保存该语言</span>
                    <input type="text" th:name="'title_' + ${lang}"
                           th:value="${i18nMap[lang] != null ? i18nMap[lang].title : ''}" /></label>
                <label>Summary
                    <textarea th:name="'summary_' + ${lang}" style="min-height:60px"
                              th:text="${i18nMap[lang] != null ? i18nMap[lang].summary : ''}"></textarea></label>
                <label>Content <span class="hint">富文本 HTML</span>
                    <textarea th:name="'content_' + ${lang}"
                              th:text="${i18nMap[lang] != null ? i18nMap[lang].content : ''}"></textarea></label>
                <label>SEO Title
                    <input type="text" th:name="'seoTitle_' + ${lang}"
                           th:value="${i18nMap[lang] != null ? i18nMap[lang].seoTitle : ''}" /></label>
                <label>SEO Description
                    <input type="text" th:name="'seoDescription_' + ${lang}"
                           th:value="${i18nMap[lang] != null ? i18nMap[lang].seoDescription : ''}" /></label>
            </fieldset>
        </th:block>

        <div class="actions">
            <button type="submit" class="btn">保存</button>
            <a th:href="@{/admin/news}" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>
</body>
</html>

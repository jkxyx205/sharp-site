<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head(title='页面编辑')}"></head>
<body>
<div class="card">
    <h1><span th:text="${page.id == null ? '新建页面' : '编辑页面'}">页面</span></h1>
    <nav><a th:href="@{/admin/pages}">← 返回列表</a></nav>
    <p class="error" th:if="${error}" th:text="${error}">错误</p>
    <form th:action="@{/admin/pages/save}" method="post">
        <input type="hidden" name="id" th:value="${page.id}" />
        <label>Page Key <span class="hint">租户内唯一,按此 upsert</span>
            <input type="text" name="pageKey" th:value="${page.pageKey}" required placeholder="about" /></label>
        <label>Path <span class="hint">URL 路径,如 /about</span>
            <input type="text" name="path" th:value="${page.path}" required placeholder="/about" /></label>
        <label>Template <span class="hint">如 themes/modern/about</span>
            <input type="text" name="template" th:value="${page.template}" required placeholder="themes/modern/about" /></label>
        <label>Status
            <select name="status">
                <option value="1" th:selected="${page.status == 1}">启用</option>
                <option value="0" th:selected="${page.status != 1}">停用</option>
            </select></label>

        <th:block th:each="lang : ${languages}">
            <fieldset th:classappend="${lang == defaultLanguage ? 'default-lang' : ''}">
                <legend><span th:text="${lang}">语言</span>
                    <span class="lang-tag" th:if="${lang == defaultLanguage}">· 默认语言</span></legend>
                <label>Title
                    <input type="text" th:name="'title_' + ${lang}"
                           th:value="${i18nMap[lang] != null ? i18nMap[lang].title : ''}" /></label>
                <label>Content <span class="hint">富文本 HTML</span>
                    <textarea th:name="'content_' + ${lang}"
                              th:text="${i18nMap[lang] != null ? i18nMap[lang].content : ''}"></textarea></label>
                <label>Cover URL
                    <input type="url" th:name="'cover_' + ${lang}"
                           th:value="${i18nMap[lang] != null ? i18nMap[lang].cover : ''}" /></label>
            </fieldset>
        </th:block>

        <div class="actions">
            <button type="submit" class="btn">保存</button>
            <a th:href="@{/admin/pages}" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head(title='页面管理')}"></head>
<body>
<div class="card">
    <h1>页面管理</h1>
    <nav><a th:href="@{/admin/}">← 返回</a> <a th:href="@{/admin/pages/new}">+ 新建页面</a></nav>
    <p class="error" th:if="${error}" th:text="${error}">错误</p>
    <table>
        <thead>
        <tr><th>Page Key</th><th>Path</th><th>Template</th><th>状态</th><th>操作</th></tr>
        </thead>
        <tbody>
        <tr th:each="p : ${pages}">
            <td th:text="${p.pageKey}">key</td>
            <td th:text="${p.path}">/path</td>
            <td th:text="${p.template}">template</td>
            <td th:text="${p.status == 1 ? '启用' : '停用'}">—</td>
            <td>
                <a th:href="@{/admin/pages/{id}/edit(id=${p.id})}">编辑</a>
                <form th:action="@{/admin/pages/{id}/delete(id=${p.id})}" method="post" style="display:inline"
                      onsubmit="return confirm('删除该页面?');">
                    <button type="submit" class="btn-link">删除</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${pages == null or pages.isEmpty()}">暂无页面。</p>
</div>
</body>
</html>

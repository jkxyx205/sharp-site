<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head(title='产品编辑')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{admin/fragments/layout :: sidebar(active='products')}"></aside>
    <div class="main">
        <header th:replace="~{admin/fragments/layout :: topbar()}"></header>
        <main class="content">
            <div class="card">
                <h1><span th:text="${product.id == null ? '新建产品' : '编辑产品'}">产品</span></h1>
                <nav class="subnav"><a class="btn" th:href="@{/admin/products}">← 返回列表</a></nav>
                <p class="error" th:if="${error}" th:text="${error}">错误</p>

                <!-- 语种切换(独立 GET 表单;新增/编辑均需先选语种) -->
                <form th:action="${product.id == null ? '/admin/products/new' : '/admin/products/' + product.id + '/edit'}" method="get">
                    <label>语种
                        <select name="lang" onchange="this.form.submit()">
                            <option th:each="l : ${languages}" th:value="${l}"
                                    th:selected="${l == currentLang}"
                                    th:text="${l + (l == defaultLanguage ? ' · 默认' : '')}">lang</option>
                        </select></label>
                </form>

                <form id="saveForm" th:action="@{/admin/products/save}" method="post">
                    <input type="hidden" name="id" th:value="${product.id}" />
                    <input type="hidden" name="language" th:value="${currentLang}" />
                    <label>Slug <span class="hint">租户内唯一 URL 标识</span>
                        <input type="text" name="slug" th:value="${product.slug}" required placeholder="smart-widget" /></label>
                    <label>分类 <span class="hint">必填</span>
                        <select name="categoryId" required>
                            <option value="">— 请选择 —</option>
                            <option th:each="c : ${categories}" th:value="${c.id}"
                                    th:selected="${product.categoryId != null && product.categoryId == c.id}"
                                    th:text="${c.slug}">category</option>
                        </select></label>
                    <label>Cover URL
                        <input type="url" name="cover" th:value="${product.cover}" placeholder="/img/widget.jpg" /></label>
                    <label>排序 <span class="hint">升序</span>
                        <input type="number" name="sort" th:value="${product.sort}" /></label>
                    <label>Status
                        <select name="status">
                            <option value="1" th:selected="${product.status == 1}">上架</option>
                            <option value="0" th:selected="${product.status != 1}">下架</option>
                        </select></label>

                    <fieldset th:classappend="${currentLang == defaultLanguage ? 'default-lang' : ''}">
                        <legend><span th:text="${currentLang}">语言</span>
                            <span class="lang-tag" th:if="${currentLang == defaultLanguage}">· 默认语言</span></legend>
                        <label class="sync-lang" th:if="${languages != null and languages.size() > 1}">
                            <input type="checkbox" name="syncToOtherLanguages" value="true" checked />
                            同步到其他语言 <span class="hint">翻译当前语种并覆盖其它启用语种</span></label>
                        <label>Name <span class="hint">必填,空则不保存该语种</span>
                            <input type="text" name="name"
                                   th:value="${i18nMap['__${currentLang}__'] != null ? i18nMap['__${currentLang}__'].name : ''}" /></label>
                        <label>Subtitle
                            <input type="text" name="subtitle"
                                   th:value="${i18nMap['__${currentLang}__'] != null ? i18nMap['__${currentLang}__'].subtitle : ''}" /></label>
                        <label>Description
                            <textarea name="description" style="min-height:60px"
                                      th:text="${i18nMap['__${currentLang}__'] != null ? i18nMap['__${currentLang}__'].description : ''}"></textarea></label>
                        <label>Content <span class="hint">富文本 HTML</span>
                            <textarea name="content"
                                      th:text="${i18nMap['__${currentLang}__'] != null ? i18nMap['__${currentLang}__'].content : ''}"></textarea></label>
                        <label>Specification JSON <span class="hint">须为合法 JSON,空则存 {}</span>
                            <textarea id="specificationJson" name="specificationJson" style="min-height:80px"
                                      th:text="${i18nMap['__${currentLang}__'] != null ? i18nMap['__${currentLang}__'].specificationJson : ''}"
                                      placeholder='{"weight":"0.5kg","color":"black"}'></textarea></label>
                        <label>SEO Title
                            <input type="text" name="seoTitle"
                                   th:value="${i18nMap['__${currentLang}__'] != null ? i18nMap['__${currentLang}__'].seoTitle : ''}" /></label>
                        <label>SEO Description
                            <input type="text" name="seoDescription"
                                   th:value="${i18nMap['__${currentLang}__'] != null ? i18nMap['__${currentLang}__'].seoDescription : ''}" /></label>
                    </fieldset>

                    <div class="actions">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <a th:href="@{/admin/products}" class="btn btn-secondary">取消</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
<script>
    document.getElementById('saveForm').addEventListener('submit', function (e) {
        var spec = document.getElementById('specificationJson').value.trim();
        if (spec !== '') {
            try { JSON.parse(spec); }
            catch (err) {
                e.preventDefault();
                alert('Specification JSON 格式不合法,请检查。\n' + err.message);
                document.getElementById('specificationJson').focus();
            }
        }
    });
</script>
</body>
</html>

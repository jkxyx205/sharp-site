<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head(title='网站发布')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{admin/fragments/layout :: sidebar(active='publish')}"></aside>
    <div class="main">
        <header th:replace="~{admin/fragments/layout :: topbar()}"></header>
        <main class="content">
            <h1>网站发布</h1>

            <div class="card">
                <form method="post" th:action="@{/admin/publish}" style="display:inline">
                    <button type="submit" class="btn btn-primary">发布新版本</button>
                </form>
                <span class="latest" th:if="${latest != null}" style="margin-left:16px">
                    当前状态:<span th:class="'status-' + ${latest.status}" th:text="${latest.status}">—</span>
                    · 版本 <strong th:text="${latest.version}">—</strong>
                    <span th:if="${latest.finishedAt != null}">· <span th:text="${#temporals.format(latest.finishedAt, 'yyyy-MM-dd HH:mm:ss')}">—</span></span>
                </span>
                <span class="latest" th:if="${latest == null}" style="margin-left:16px">暂无发布记录</span>
            </div>

            <div class="card">
                <table>
                    <thead>
                    <tr><th>版本</th><th>状态</th><th>开始时间</th><th>完成时间</th><th>错误信息</th><th>下载</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${records}">
                        <td th:text="${r.version}">v001</td>
                        <td><span th:class="'status-' + ${r.status}" th:text="${r.status}">—</span></td>
                        <td><span th:if="${r.startedAt != null}" th:text="${#temporals.format(r.startedAt, 'yyyy-MM-dd HH:mm:ss')}">—</span></td>
                        <td><span th:if="${r.finishedAt != null}" th:text="${#temporals.format(r.finishedAt, 'yyyy-MM-dd HH:mm:ss')}">—</span></td>
                        <td class="error" th:text="${r.errorMessage ?: ''}">—</td>
                        <td><a th:if="${r.status == 'SUCCESS'}" th:href="@{/admin/publish/{v}/download(v=${r.version})}">下载</a></td>
                    </tr>
                    </tbody>
                </table>
                <p class="empty" th:if="${records == null or records.isEmpty()}">暂无发布记录。</p>
            </div>
        </main>
    </div>
</div>
</body>
</html>

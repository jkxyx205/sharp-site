<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head(title='网站设置')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{admin/fragments/layout :: sidebar(active='settings')}"></aside>
    <div class="main">
        <header th:replace="~{admin/fragments/layout :: topbar()}"></header>
        <main class="content">
            <div class="card">
                <h1>网站设置</h1>
                <p class="error" th:if="${error}" th:text="${error}">错误</p>
                <p class="hint" th:if="${msg}" th:text="${msg}">提示</p>

                <form th:action="@{/admin/settings/save}" method="post">
                    <label>租户名称 <span class="hint">必填</span>
                        <input type="text" name="name" th:value="${tenant.name}" required /></label>

                    <label>主题
                        <select name="themeId">
                            <option th:each="t : ${themes}" th:value="${t}"
                                    th:selected="${t == tenant.themeId}" th:text="${t}">theme</option>
                        </select></label>

                    <label>状态
                        <select name="status">
                            <option value="1" th:selected="${tenant.status != null and tenant.status.intValue() == 1}">启用</option>
                            <option value="0" th:selected="${tenant.status != null and tenant.status.intValue() != 1}">停用</option>
                        </select></label>

                    <fieldset>
                        <legend>只读(身份标识,不可修改)</legend>
                        <label>租户 ID
                            <input type="text" th:value="${tenant.id}" disabled /></label>
                        <label>编码 (code)
                            <input type="text" th:value="${tenant.code}" disabled /></label>
                    </fieldset>

                    <div class="actions">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <a class="btn" th:href="@{/admin/settings}">取消</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
</body>
</html>

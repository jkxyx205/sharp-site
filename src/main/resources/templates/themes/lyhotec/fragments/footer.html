    <script>
    (function () {
        var prefersReduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var els = document.querySelectorAll('[data-reveal]');
        if (prefersReduce || !('IntersectionObserver' in window)) {
            els.forEach(function (e) { e.classList.add('is-visible'); });
        } else {
            var io = new IntersectionObserver(function (entries) {
                entries.forEach(function (en) {
                    if (en.isIntersecting) { en.target.classList.add('is-visible'); io.unobserve(en.target); }
                });
            }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
            els.forEach(function (e) { io.observe(e); });
        }
        /* product detail tabs */
        document.querySelectorAll('.pd-tabs [data-tab]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var head = btn.closest('.tab-head');
                var wrap = head.parentElement;
                head.querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
                btn.classList.add('active');
                wrap.querySelectorAll('.tab-pane').forEach(function (p) { p.classList.remove('active'); });
                var target = wrap.querySelector('[data-pane="' + btn.getAttribute('data-tab') + '"]');
                if (target) target.classList.add('active');
            });
        });
    })();
    </script>

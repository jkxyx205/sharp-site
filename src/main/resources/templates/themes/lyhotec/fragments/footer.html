<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- 页脚 (README §10):企业信息来自 TenantConfig,判空访问,不硬编码。 -->
<footer th:fragment="footer(siteName, config)" class="site-footer">
    <div class="container footer-grid">
        <div class="footer-brand">
            <div class="brand">
                <img class="brand-logo" th:src="@{/themes-images/{tid}/images/lyhotec-logo.png(tid=${themeId})}" src="/themes-images/lyhotec/images/lyhotec-logo.png" th:alt="${siteName}" alt="LYHOTEC" width="36" height="36" />
<!--                <span class="brand-mark" th:text="${siteName}">LYHOTEC</span>-->
            </div>
            <p class="footer-tagline" th:text="#{footer.tagline}">Tagline</p>
        </div>
        <div class="footer-col">
            <h5 th:text="#{footer.nav.title}">Navigate</h5>
            <ul>
                <li><a th:href="@{${localePrefix + '/'}}" th:text="#{nav.home}">Home</a></li>
                <li><a th:href="@{${localePrefix + '/products'}}" th:text="#{nav.products}">Products</a></li>
                <li><a th:href="@{${localePrefix + '/news'}}" th:text="#{nav.news}">News</a></li>
                <li><a th:href="@{${localePrefix + '/about'}}" th:text="#{nav.about}">About</a></li>
                <li><a th:href="@{${localePrefix + '/contact'}}" th:text="#{nav.contact}">Contact</a></li>
            </ul>
        </div>
        <div class="footer-col">
            <h5 th:text="#{footer.contact.title}">Contact</h5>
            <ul>
                <li th:if="${config != null and config.address != null}" th:text="${config.address}">Address</li>
                <li th:if="${config != null and config.phone != null}" th:text="|#{common.tel}: ${config.phone}|">Tel</li>
                <li th:if="${config != null and config.email != null}">
                    <a th:href="'mailto:' + ${config.email}" th:text="${config.email}">email</a>
                </li>
                <li th:if="${config != null and config.whatsapp != null}" th:text="|#{common.whatsapp}: ${config.whatsapp}|">WhatsApp</li>
            </ul>
        </div>
    </div>
    <div class="container footer-bottom">
        <p th:if="${config != null and config.copyright != null}" th:text="${config.copyright}">© Year Site</p>
        <p th:if="${config == null or config.copyright == null}" th:text="#{footer.copyright}">© 2026 LYHOTEC</p>
        <p th:if="${config != null and config.icp != null}" th:text="${config.icp}" class="icp">ICP</p>
    </div>
</footer>
</html>

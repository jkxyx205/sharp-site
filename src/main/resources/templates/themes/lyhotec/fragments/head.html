<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- LYHOTEC 主题 <head>: Inter 字体 + SEO + 内联设计系统(极简科技风)。
     配色:纯白 / 深空灰 / 曜石黑 · 银色 / 浅灰 · 亮青 / 极光蓝(科技强调色)。
     样式内联,使静态发布产物自带样式,不依赖外部 CSS。 -->
<head th:fragment="head(pageTitle, pageDescription, pageKeywords, canonical, robots)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <th:block th:replace="~{themes/__${themeId}__/fragments/seo :: seo(title=${pageTitle}, description=${pageDescription}, keywords=${pageKeywords}, canonical=${canonical}, robots=${robots})}"></th:block>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
           LYHOTEC design system — minimalist high-tech (Dyson/Bissell 高端线)
           断点: mobile < 640 · tablet 640–1023 · desktop >= 1024
           科技感来自亮青/极光蓝渐变强调、深色 hero 板块、克制留白与细线。
           ============================================================ */
        :root {
            --l-white:   #ffffff;
            --l-space:   #1a1d24;   /* 深空灰(深色板块底) */
            --l-obsidian:#0b0d10;   /* 曜石黑(最深 / 正文) */
            --l-silver:  #c9ced6;   /* 银色 */
            --l-gray:    #e8eaed;   /* 浅灰 */
            --l-line:    #eceef1;   /* 边框 */
            --l-line-2:  #d8dbe0;   /* 略深边框 */
            --l-ink:     #0b0d10;   /* 正文 */
            --l-ink-2:   #3a4049;   /* 次级文字 */
            --l-muted:   #6b7178;   /* 弱化文字 */
            --l-tint:    #f5f6f8;   /* 交替板块底 */
            --l-cyan:    #00c9d4;   /* 亮青 */
            --l-aurora:  #1fb6ff;   /* 极光蓝 */
            --l-accent:  #00c9d4;
            --l-accent-2:#1fb6ff;
            --l-grad:    linear-gradient(135deg, #00c9d4 0%, #1fb6ff 100%);
            --l-grad-soft: linear-gradient(135deg, rgba(0,201,212,.12), rgba(31,182,255,.12));

            --l-max: 1280px;
            --l-pad: 28px;
            --l-fs-base: 17px;
            --l-radius: 14px;
            --l-radius-sm: 10px;
            --l-shadow: 0 1px 2px rgba(11,13,16,.04), 0 18px 48px rgba(11,13,16,.07);
            --l-ring: 0 0 0 3px rgba(0,201,212,.30);
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
        body {
            margin: 0;
            font: 400 var(--l-fs-base)/1.6 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Source Han Sans SC", "Noto Sans SC", Arial, sans-serif;
            color: var(--l-ink);
            background: var(--l-white);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }
        a { color: inherit; text-decoration: none; }
        img, svg { max-width: 100%; height: auto; display: block; }
        figure { margin: 0; }
        h1, h2, h3, h4, p { margin: 0; }

        /* layout */
        .container { width: 100%; max-width: var(--l-max); margin: 0 auto; padding: 0 var(--l-pad); }
        .section { padding: 104px 0; position: relative; overflow: hidden; }
        .section--light { background: var(--l-white); }
        .section--alt   { background: var(--l-tint); }
        .section--dark  { background: var(--l-space); color: #eef1f4; }
        .section--dark .l-muted { color: #9aa3ad; }
        .eyebrow {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: .74rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
            color: var(--l-accent);
        }
        .eyebrow::before { content: ""; width: 18px; height: 2px; background: var(--l-grad); display: inline-block; }
        .section-head { max-width: 780px; margin-bottom: 56px; }
        .section-head.center { margin-left: auto; margin-right: auto; text-align: center; }
        .section-head h2 {
            font-size: clamp(2rem, 4.6vw, 3.3rem); line-height: 1.08; font-weight: 800;
            letter-spacing: -0.02em; margin-top: 16px; color: inherit;
        }
        .section-head p { margin-top: 18px; color: var(--l-muted); font-size: 1.06rem; max-width: 62ch; }
        .section--dark .section-head p { color: #9aa3ad; }
        .l-muted { color: var(--l-muted); }

        /* buttons */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
            font: inherit; font-weight: 600; font-size: .95rem; letter-spacing: .01em;
            padding: 14px 28px; border-radius: 999px; border: 1px solid transparent;
            transition: background .2s, color .2s, border-color .2s, box-shadow .2s, transform .15s;
        }
        .btn-accent { background: var(--l-grad); color: var(--l-obsidian); }
        .btn-accent:hover { box-shadow: 0 10px 28px rgba(0,201,212,.35); transform: translateY(-1px); }
        .btn-dark { background: var(--l-obsidian); color: var(--l-white); }
        .btn-dark:hover { background: var(--l-space); }
        .btn-ghost { background: transparent; color: var(--l-ink); border-color: var(--l-line-2); }
        .btn-ghost:hover { border-color: var(--l-ink); background: var(--l-white); }
        .btn-light { background: var(--l-white); color: var(--l-ink); border: 1px solid var(--l-line-2); }
        .btn-light:hover { border-color: var(--l-accent); box-shadow: var(--l-shadow); }
        .btn-lg { padding: 17px 38px; font-size: 1rem; }
        .btn-block { width: 100%; }

        /* ---------- header ---------- */
        .site-header {
            position: sticky; top: 0; z-index: 50;
            background: rgba(255,255,255,.84); backdrop-filter: saturate(180%) blur(18px);
            -webkit-backdrop-filter: saturate(180%) blur(18px);
            border-bottom: 1px solid var(--l-line); color: var(--l-ink);
        }
        .header-inner { display: flex; align-items: center; justify-content: space-between; min-height: 72px; gap: 16px; }
        .brand { display: inline-flex; align-items: baseline; gap: 8px; font-weight: 800; font-size: 1.32rem; letter-spacing: .06em; color: var(--l-ink); }
        .brand .accent-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--l-grad); display: inline-block; box-shadow: 0 0 12px rgba(0,201,212,.6); }
        .brand small { font-weight: 500; font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; color: var(--l-muted); }
        .site-nav { display: flex; align-items: center; gap: 30px; }
        .site-nav a { font-size: .92rem; color: var(--l-ink-2); transition: color .2s; position: relative; }
        .site-nav a:hover { color: var(--l-ink); }
        .site-nav a.active { color: var(--l-ink); font-weight: 600; }
        .site-nav a.active::after {
            content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 2px;
            background: var(--l-grad); border-radius: 2px;
        }
        .nav-cta { margin-left: 6px; }
        .nav-toggle { display: none; background: none; border: 0; color: var(--l-ink); font-size: 1.6rem; cursor: pointer; line-height: 1; }

        /* ---------- hero ---------- */
        .hero { position: relative; color: var(--l-white); overflow: hidden; background: var(--l-obsidian); }
        .hero::before {
            content: ""; position: absolute; inset: 0;
            background:
                radial-gradient(48% 50% at 82% 26%, rgba(0,201,212,.22), transparent 60%),
                radial-gradient(44% 46% at 14% 74%, rgba(31,182,255,.18), transparent 64%);
        }
        .hero::after {
            content: ""; position: absolute; inset: 0; opacity: .35;
            background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
            background-size: 64px 64px;
            -webkit-mask-image: radial-gradient(circle at 50% 36%, #000, transparent 72%);
            mask-image: radial-gradient(circle at 50% 36%, #000, transparent 72%);
        }
        .hero .container { position: relative; z-index: 1; display: grid; grid-template-columns: 1.06fr .94fr; gap: 56px; align-items: center; padding-top: 132px; padding-bottom: 104px; }
        .hero .eyebrow { color: var(--l-cyan); }
        .hero h1 {
            font-size: clamp(2.7rem, 7vw, 5.2rem); line-height: .96; font-weight: 800;
            letter-spacing: -0.03em; margin: 22px 0 24px;
        }
        .hero h1 .grad { background: var(--l-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .hero-sub { color: #b9c0c8; font-size: 1.18rem; max-width: 52ch; line-height: 1.55; }
        .hero-actions { display: flex; gap: 14px; margin-top: 36px; flex-wrap: wrap; }
        .hero-specs { display: flex; gap: 38px; margin-top: 48px; flex-wrap: wrap; }
        .hero-specs .num { font-size: 1.9rem; font-weight: 800; letter-spacing: -.02em; color: var(--l-white); }
        .hero-specs .lbl { font-size: .8rem; color: #8b93a0; letter-spacing: .04em; margin-top: 4px; }

        /* hero visual: CSS 动画"清洁过程"舞台 */
        .hero-stage {
            position: relative; aspect-ratio: 4/5; border-radius: var(--l-radius); overflow: hidden;
            background: linear-gradient(160deg, #15181f, #0b0d10);
            border: 1px solid rgba(255,255,255,.08);
            box-shadow: 0 40px 90px rgba(0,0,0,.5);
        }
        .hero-stage .scan {
            position: absolute; left: 8%; right: 8%; height: 14px; border-radius: 999px;
            background: var(--l-grad); box-shadow: 0 0 30px rgba(0,201,212,.7), 0 0 60px rgba(31,182,255,.5);
            top: 12%; opacity: .95;
            animation: scanMove 3.6s cubic-bezier(.45,0,.55,1) infinite;
        }
        @keyframes scanMove {
            0% { top: 12%; }
            50% { top: 82%; }
            100% { top: 12%; }
        }
        .hero-stage .surface {
            position: absolute; left: 0; right: 0; bottom: 0; top: 0;
            background-image:
                radial-gradient(circle at 30% 40%, rgba(120,90,60,.5) 0 2px, transparent 3px),
                radial-gradient(circle at 60% 55%, rgba(90,70,50,.45) 0 2px, transparent 3px),
                radial-gradient(circle at 45% 70%, rgba(140,100,70,.4) 0 2px, transparent 3px),
                radial-gradient(circle at 70% 30%, rgba(80,60,45,.4) 0 2px, transparent 3px),
                linear-gradient(120deg, #2a241c, #1a1612);
            background-size: 26px 26px, 30px 30px, 24px 24px, 28px 28px, 100% 100%;
        }
        .hero-stage .device {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 42%; filter: drop-shadow(0 24px 50px rgba(0,0,0,.6));
        }

        /* ---------- stat band ---------- */
        .stat-band { background: var(--l-obsidian); color: var(--l-white); padding: 64px 0; }
        .stat-band .grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 32px; text-align: center; }
        .stat-band .num { font-size: clamp(2rem,3.4vw,3rem); font-weight: 800; letter-spacing: -.02em; }
        .stat-band .num .grad { background: var(--l-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .stat-band .lbl { color: #8b93a0; font-size: .86rem; letter-spacing: .05em; margin-top: 8px; }

        /* ---------- feature / category grid ---------- */
        .grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 24px; }
        .grid-2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 28px; }
        .card {
            position: relative; display: flex; flex-direction: column; gap: 16px;
            padding: 30px; border-radius: var(--l-radius); overflow: hidden;
            background: var(--l-white); border: 1px solid var(--l-line);
            transition: border-color .25s, box-shadow .25s, transform .25s;
        }
        .card:hover { border-color: var(--l-accent); box-shadow: var(--l-shadow); transform: translateY(-3px); }
        .card .media {
            aspect-ratio: 4/3; border-radius: var(--l-radius-sm); display: grid; place-items: center; overflow: hidden;
            background: linear-gradient(150deg, #f5f6f8, #e8eaed); border: 1px solid var(--l-line);
        }
        .card .media svg { width: 54%; }
        .card h3 { font-size: 1.3rem; font-weight: 700; letter-spacing: -.01em; color: var(--l-ink); }
        .card p { color: var(--l-muted); font-size: .96rem; }
        .card .link { margin-top: auto; font-weight: 600; font-size: .9rem; color: var(--l-accent); }
        .card .pill {
            position: absolute; top: 18px; right: 18px; font-size: .66rem; font-weight: 600;
            letter-spacing: .12em; text-transform: uppercase; color: var(--l-accent);
            background: var(--l-grad-soft); padding: 5px 10px; border-radius: 999px;
        }

        /* ---------- split feature block ---------- */
        .split { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
        .split + .split { margin-top: 110px; }
        .split.flip .sp-media { order: 2; }
        .sp-media { position: relative; }
        .sp-media .stage {
            aspect-ratio: 5/6; border-radius: var(--l-radius); display: grid; place-items: center; overflow: hidden;
            background: linear-gradient(150deg, #f5f6f8, #e8eaed); border: 1px solid var(--l-line);
        }
        .sp-media.dark .stage { background: linear-gradient(160deg,#15181f,#0b0d10); border-color: rgba(255,255,255,.08); }
        .sp-media .stage svg { width: 58%; }
        .sp-eyebrow { font-size: .74rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--l-accent); }
        .sp-name { font-size: clamp(1.9rem,4vw,2.9rem); font-weight: 800; letter-spacing: -.02em; line-height: 1.08; margin: 16px 0 10px; }
        .sp-lead { color: var(--l-muted); font-size: 1.05rem; max-width: 54ch; }
        .feature-list { margin-top: 28px; display: flex; flex-direction: column; gap: 16px; }
        .feature-list .fi { display: flex; gap: 14px; align-items: flex-start; }
        .feature-list .fi .ico {
            flex: none; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
            background: var(--l-grad-soft); color: var(--l-accent);
        }
        .feature-list .fi .ico svg { width: 18px; height: 18px; }
        .feature-list .fi h4 { font-size: 1rem; font-weight: 700; }
        .feature-list .fi p { color: var(--l-muted); font-size: .92rem; margin-top: 3px; }

        /* ---------- spec table ---------- */
        .spec-table { margin-top: 36px; border-top: 1px solid var(--l-line); }
        .spec-table .row { display: grid; grid-template-columns: 1fr auto; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--l-line); align-items: baseline; }
        .spec-table .k { font-size: .9rem; color: var(--l-muted); }
        .spec-table .v { font-weight: 700; font-size: 1.02rem; color: var(--l-ink); }

        /* ---------- before / after ---------- */
        .ba-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .ba-card { position: relative; border-radius: var(--l-radius); overflow: hidden; aspect-ratio: 4/3; border: 1px solid var(--l-line); }
        .ba-card .dirty {
            position: absolute; inset: 0;
            background:
                radial-gradient(circle at 28% 42%, rgba(110,80,50,.55) 0 10px, transparent 12px),
                radial-gradient(circle at 58% 55%, rgba(90,65,40,.5) 0 14px, transparent 16px),
                radial-gradient(circle at 42% 70%, rgba(130,95,60,.45) 0 8px, transparent 10px),
                radial-gradient(circle at 72% 35%, rgba(80,58,38,.4) 0 12px, transparent 14px),
                linear-gradient(120deg,#6b5440,#4a3b2e);
            background-size: 40px 40px, 46px 46px, 34px 34px, 50px 50px, 100% 100%;
        }
        .ba-card .clean {
            position: absolute; inset: 0;
            background:
                radial-gradient(circle at 50% 0%, rgba(0,201,212,.18), transparent 60%),
                linear-gradient(160deg,#f3f5f7,#dfe3e8);
        }
        .ba-card .clean::after {
            content: ""; position: absolute; left: 0; right: 0; top: 0; height: 40%;
            background: linear-gradient(180deg, rgba(0,201,212,.25), transparent);
            animation: cleanWipe 3.4s ease-in-out infinite;
        }
        @keyframes cleanWipe { 0%,30%{height:0;opacity:0} 40%{opacity:1} 70%{height:100%;opacity:1} 100%{height:100%;opacity:0} }
        .ba-card .label {
            position: absolute; top: 16px; left: 16px; z-index: 2;
            font-size: .72rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
            padding: 6px 12px; border-radius: 999px;
        }
        .ba-card .label.before { background: rgba(11,13,16,.7); color: #fff; }
        .ba-card .label.after { background: var(--l-grad); color: var(--l-obsidian); }

        /* ---------- product detail ---------- */
        .pd-top { display: grid; grid-template-columns: 1.05fr .95fr; gap: 56px; align-items: start; }
        .gallery { display: flex; flex-direction: column; gap: 14px; }
        .gallery .main {
            aspect-ratio: 1/1; border-radius: var(--l-radius); display: grid; place-items: center; overflow: hidden;
            background: linear-gradient(150deg,#f5f6f8,#e8eaed); border: 1px solid var(--l-line);
        }
        .gallery .main svg { width: 56%; }
        .gallery .thumbs { display: flex; gap: 10px; }
        .gallery .thumbs .t {
            flex: 1; aspect-ratio: 1/1; border-radius: var(--l-radius-sm); display: grid; place-items: center;
            background: linear-gradient(150deg,#f5f6f8,#e8eaed); border: 1px solid var(--l-line); cursor: pointer;
        }
        .gallery .thumbs .t svg { width: 50%; opacity: .8; }
        .pd-name { font-size: clamp(2rem,4vw,3rem); font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
        .pd-sub { color: var(--l-muted); font-size: 1.1rem; margin-top: 10px; }
        .pd-price { font-size: 2rem; font-weight: 800; margin-top: 24px; }
        .pd-price .cur { font-size: 1.1rem; font-weight: 600; color: var(--l-muted); }
        .pd-price .grad { background: var(--l-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .pd-actions { display: flex; gap: 14px; margin-top: 28px; flex-wrap: wrap; }
        .qty { display: inline-flex; align-items: center; border: 1px solid var(--l-line-2); border-radius: 999px; overflow: hidden; }
        .qty button { width: 44px; height: 48px; border: 0; background: var(--l-white); font-size: 1.2rem; cursor: pointer; color: var(--l-ink); }
        .qty input { width: 48px; height: 48px; border: 0; text-align: center; font: inherit; font-weight: 600; }
        .pd-tabs { margin-top: 88px; }
        .tab-head { display: flex; gap: 8px; border-bottom: 1px solid var(--l-line); overflow-x: auto; }
        .tab-head button {
            background: none; border: 0; padding: 16px 22px; font: inherit; font-weight: 600; color: var(--l-muted);
            border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
        }
        .tab-head button.active { color: var(--l-ink); border-color: var(--l-accent); }
        .tab-pane { padding-top: 40px; display: none; }
        .tab-pane.active { display: block; }

        /* FAQ */
        .faq { display: flex; flex-direction: column; gap: 12px; }
        .faq details {
            border: 1px solid var(--l-line); border-radius: var(--l-radius-sm); padding: 0;
            background: var(--l-white);
        }
        .faq summary {
            cursor: pointer; padding: 20px 24px; font-weight: 600; list-style: none;
            display: flex; justify-content: space-between; align-items: center; gap: 16px;
        }
        .faq summary::-webkit-details-marker { display: none; }
        .faq summary::after { content: "+"; font-size: 1.4rem; color: var(--l-accent); transition: transform .2s; }
        .faq details[open] summary::after { transform: rotate(45deg); }
        .faq .ans { padding: 0 24px 22px; color: var(--l-muted); }

        /* reviews */
        .review-card { padding: 28px; border: 1px solid var(--l-line); border-radius: var(--l-radius); background: var(--l-white); }
        .review-card .stars { color: var(--l-accent); letter-spacing: 2px; }
        .review-card h4 { margin-top: 12px; font-size: 1.02rem; }
        .review-card p { margin-top: 8px; color: var(--l-muted); font-size: .94rem; }
        .review-card .who { margin-top: 14px; font-size: .84rem; color: var(--l-muted); }

        /* ---------- filter sidebar (products) ---------- */
        .shop { display: grid; grid-template-columns: 260px 1fr; gap: 40px; align-items: start; }
        .filter { position: sticky; top: 88px; display: flex; flex-direction: column; gap: 26px; }
        .filter .group { border-bottom: 1px solid var(--l-line); padding-bottom: 22px; }
        .filter .group h4 { font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--l-muted); margin-bottom: 14px; }
        .filter label { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: .92rem; color: var(--l-ink-2); cursor: pointer; }
        .filter input[type=checkbox] { accent-color: var(--l-accent); width: 16px; height: 16px; }
        .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip { font-size: .82rem; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--l-line-2); color: var(--l-ink-2); cursor: pointer; transition: all .2s; }
        .chip:hover, .chip.on { border-color: var(--l-accent); color: var(--l-accent); background: var(--l-grad-soft); }

        /* ---------- accessories ---------- */
        .acc-card { padding: 24px; border: 1px solid var(--l-line); border-radius: var(--l-radius); background: var(--l-white); text-align: center; transition: all .25s; }
        .acc-card:hover { border-color: var(--l-accent); box-shadow: var(--l-shadow); transform: translateY(-3px); }
        .acc-card .media { aspect-ratio: 1/1; border-radius: var(--l-radius-sm); display: grid; place-items: center; background: linear-gradient(150deg,#f5f6f8,#e8eaed); margin-bottom: 16px; }
        .acc-card .media svg { width: 52%; }
        .acc-card h3 { font-size: 1.04rem; font-weight: 700; }
        .acc-card .price { color: var(--l-accent); font-weight: 700; margin-top: 6px; }

        /* ---------- support ---------- */
        .support-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 24px; }

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- 公共 <head>:charset/viewport + SEO + 主题样式(内联)。
     lyhotec 主题 —— 主色 #ddc35c,直角(无圆角),极简,以细线与排版构建结构,
     拒绝大段色块(无大面积纯色背景);科技感来源于网格、留白与字距。
     样式内联,使静态发布产物自带样式,不依赖外部 CSS。 -->
<head th:fragment="head(pageTitle, pageDescription, pageKeywords, canonical, robots, siteName)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" th:href="@{/themes-images/{tid}/images/lyhotec-logo.png(tid=${themeId})}" href="/themes-images/lyhotec/images/lyhotec-logo.png" />
    <th:block th:replace="~{themes/__${themeId}__/fragments/seo :: seo(title=${pageTitle}, description=${pageDescription}, keywords=${pageKeywords}, canonical=${canonical}, robots=${robots}, siteName=${siteName})}"></th:block>
    <style>
        :root {
            --gold: #ddc35c;
            --gold-deep: #c2a23c;
            --ink: #111111;
            --ink-soft: #2b2b2b;
            --muted: #6f6f6f;
            --line: #e6e6e6;
            --line-strong: #cfcfcf;
            --bg: #ffffff;
            --bg-soft: #fafafa;
            --max: 1240px;
            --ease: cubic-bezier(.2,.7,.3,1);
        }
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: "Inter", "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: var(--ink);
            background: var(--bg);
            line-height: 1.6;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }
        a { color: var(--ink); text-decoration: none; transition: color .2s var(--ease); }
        a:hover { color: var(--gold-deep); }
        img, svg { max-width: 100%; height: auto; display: block; }
        ul { margin: 0; padding: 0; list-style: none; }
        h1, h2, h3, h4, h5, p { margin: 0; }

        /* layout */
        .container { width: 100%; max-width: var(--max); margin: 0 auto; padding: 0 32px; }
        .section { padding: 96px 0; }
        .section-sm { padding: 64px 0; }
        .rich-text { max-width: 760px; }
        .rich-text p { margin: 0 0 1.2em; }
        .empty { color: var(--muted); }

        /* type — section labels & headings */
        .eyebrow {
            display: inline-flex; align-items: center; gap: 10px;
            font-size: .72rem; font-weight: 600; letter-spacing: .22em;
            text-transform: uppercase; color: var(--gold-deep);
        }
        .eyebrow::before { content: ""; width: 24px; height: 1px; background: var(--gold); display: inline-block; }
        .h-display {
            font-size: clamp(2rem, 5vw, 3.6rem); line-height: 1.08; font-weight: 600;
            letter-spacing: -.02em; color: var(--ink); margin: 20px 0;
        }
        .h-section {
            font-size: clamp(1.6rem, 3.2vw, 2.4rem); line-height: 1.15; font-weight: 600;
            letter-spacing: -.01em; margin: 18px 0 14px;
        }
        .lead { color: var(--muted); font-size: 1.05rem; max-width: 56ch; }
        .rule { height: 1px; background: var(--line); border: 0; margin: 0; }
        .section-head { margin-bottom: 56px; max-width: 720px; }

        /* buttons — sharp corners, bordered, no color blocks */
        .btn {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 15px 30px; border: 1px solid var(--ink); background: transparent;
            color: var(--ink); font: inherit; font-size: .8rem; font-weight: 600;
            letter-spacing: .12em; text-transform: uppercase; cursor: pointer;
            transition: background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease);
            border-radius: 0;
        }
        .btn:hover { background: var(--ink); color: #fff; }
        .btn-gold { border-color: var(--gold); color: var(--ink); }
        .btn-gold:hover { background: var(--gold); color: var(--ink); border-color: var(--gold); }
        .btn-solid { background: var(--ink); color: #fff; }
        .btn-solid:hover { background: var(--gold); border-color: var(--gold); color: var(--ink); }
        .btn:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
            outline: 2px solid var(--gold); outline-offset: 3px;
        }

        /* header */
        .site-header { position: sticky; top: 0; z-index: 50; background: var(--bg); border-bottom: 1px solid var(--line); }
        .header-inner { display: flex; align-items: center; justify-content: space-between; min-height: 72px; gap: 24px; }
        .brand { display: flex; align-items: center; gap: 12px; line-height: 1.1; }
        .brand-logo { height: 36px; width: auto; flex: none; display: block; }
        .brand-text { display: flex; flex-direction: column; }
        .brand-mark { font-weight: 700; font-size: 1.1rem; letter-spacing: .16em; color: var(--ink); }
        .brand-tag { font-size: .62rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
        .site-nav { display: flex; align-items: center; gap: 28px; }
        .site-nav > a { font-size: .82rem; font-weight: 500; letter-spacing: .06em; color: var(--ink-soft); position: relative; padding: 6px 0; }
        .site-nav > a:hover { color: var(--ink); }
        .site-nav > a.active { color: var(--ink); }
        .site-nav > a.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--gold); }
        .nav-toggle { display: none; background: none; border: 1px solid var(--line-strong); width: 44px; height: 44px; cursor: pointer; font-size: 1.1rem; color: var(--ink); border-radius: 0; }

        /* language switch */
        .lang-switch { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-left: 12px; padding-left: 16px; border-left: 1px solid var(--line); }
        .lang-switch a { color: var(--muted); }
        .lang-switch a.active { color: var(--ink); font-weight: 600; }

        /* hero — no big color block: thin grid texture + type */
        .hero { position: relative; border-bottom: 1px solid var(--line); overflow: hidden; }
        .hero-inner { display: grid; grid-template-columns: 1.15fr .85fr; gap: 48px; align-items: center; padding: 104px 0 96px; }
        .hero-text .eyebrow { margin-bottom: 8px; }
        .hero-text .h-display { margin-top: 18px; }
        .hero-sub { color: var(--muted); font-size: 1.08rem; max-width: 48ch; margin-top: 8px; }
        .hero-cta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 36px; }
        .hero-visual { position: relative; min-height: 340px; display: grid; place-items: center; }
        .hero-visual::before {
            content: ""; position: absolute; inset: -20px;
            background-image:
                linear-gradient(to right, var(--line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--line) 1px, transparent 1px);
            background-size: 40px 40px;
            -webkit-mask-image: radial-gradient(circle at 60% 40%, #000 0%, transparent 75%);
            mask-image: radial-gradient(circle at 60% 40%, #000 0%, transparent 75%);
            opacity: .8;
        }
        .hero-visual svg { position: relative; max-width: 320px; width: 100%; }
        .hero-stats { display: flex; gap: 40px; margin-top: 56px; border-top: 1px solid var(--line); padding-top: 28px; }
        .hero-stat .n { font-size: 1.6rem; font-weight: 600; letter-spacing: -.02em; }
        .hero-stat .l { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

        /* generic grid */
        .grid { display: grid; gap: 28px; }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-2 { grid-template-columns: repeat(2, 1fr); }

        /* category card (home + products) */
        .cat-card { border: 1px solid var(--line); background: var(--bg); padding: 32px; display: flex; flex-direction: column; gap: 20px; transition: border-color .2s var(--ease), transform .2s var(--ease); position: relative; }
        .cat-card::before { content: ""; position: absolute; left: 0; top: 0; height: 2px; width: 0; background: var(--gold); transition: width .25s var(--ease); }
        .cat-card:hover { border-color: var(--line-strong); transform: translateY(-3px); }
        .cat-card:hover::before { width: 100%; }
        .cat-card .illus { width: 100%; aspect-ratio: 4/3; display: grid; place-items: center; background: var(--bg-soft); }
        .cat-card .illus svg { max-width: 140px; }
        .cat-card h3 { font-size: 1.25rem; font-weight: 600; }
        .cat-card p { color: var(--muted); font-size: .92rem; }
        .cat-card .idx { font-size: .7rem; letter-spacing: .18em; color: var(--gold-deep); text-transform: uppercase; }

        /* product card */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 28px; }
        .product-card { border: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; transition: border-color .2s var(--ease), transform .2s var(--ease); position: relative; }
        .product-card::before { content: ""; position: absolute; left: 0; top: 0; height: 2px; width: 0; background: var(--gold); transition: width .25s var(--ease); }
        .product-card:hover { border-color: var(--line-strong); transform: translateY(-3px); }
        .product-card:hover::before { width: 100%; }
        .product-card .media { aspect-ratio: 4/3; display: grid; place-items: center; background: var(--bg-soft); border-bottom: 1px solid var(--line); }
        .product-card .media svg { max-width: 130px; }
        .product-card .body { padding: 22px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .product-card .cat-label { font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-deep); }
        .product-card h3 { font-size: 1.08rem; font-weight: 600; }
        .product-card p { font-size: .88rem; color: var(--muted); flex: 1; }
        .product-card .more { font-size: .76rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); margin-top: 6px; }
        .product-card .more::after { content: " →"; color: var(--gold-deep); }
        .product-card:hover .more { color: var(--gold-deep); }

        /* category section on products page */
        .cat-block { border-top: 1px solid var(--line); padding: 72px 0; }
        .cat-block-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 40px; }
        .cat-block-head .left { max-width: 60ch; }
        .cat-block-head h2 { font-size: 1.8rem; font-weight: 600; letter-spacing: -.01em; }
        .cat-block-head p { color: var(--muted); margin-top: 8px; }
        .cat-block-head .idx { font-size: .72rem; letter-spacing: .18em; color: var(--gold-deep); text-transform: uppercase; }

        /* news list */
        .news-list { border-top: 1px solid var(--line); }
        .news-item { border-bottom: 1px solid var(--line); }
        .news-item a { display: grid; grid-template-columns: 120px 1fr auto; gap: 32px; padding: 28px 0; align-items: center; }
        .news-item .date { font-size: .8rem; letter-spacing: .08em; color: var(--muted); font-variant-numeric: tabular-nums; }
        .news-item .meta h3 { font-size: 1.12rem; font-weight: 600; color: var(--ink); }
        .news-item .meta p { color: var(--muted); font-size: .9rem; margin-top: 6px; }
        .news-item .arr { font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-deep); white-space: nowrap; }
        .news-item a:hover h3 { color: var(--gold-deep); }

        /* about */
        .about-intro { display: grid; grid-template-columns: 1fr 1.4fr; gap: 64px; align-items: start; }
        .about-intro .left { position: sticky; top: 96px; }
        .about-stats { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 64px 0; }
        .about-stat { padding: 32px; border-right: 1px solid var(--line); }
        .about-stat:last-child { border-right: 0; }
        .about-stat .n { font-size: 1.8rem; font-weight: 600; letter-spacing: -.02em; }
        .about-stat .l { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
        .factory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
        .factory-card { border: 1px solid var(--line); }
        .factory-card .media { aspect-ratio: 3/2; display: grid; place-items: center; background: var(--bg-soft); border-bottom: 1px solid var(--line); }
        .factory-card .media svg { max-width: 180px; }
        .factory-card .cap { padding: 18px 20px; font-size: .86rem; font-weight: 500; color: var(--ink-soft); }

        /* contact */
        .contact-grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: 64px; align-items: start; }
        .contact-info ul li { padding: 14px 0; border-bottom: 1px solid var(--line); font-size: .92rem; color: var(--ink-soft); display: flex; gap: 12px; }
        .contact-info ul li .k { color: var(--muted); min-width: 90px; font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; }
        .contact-form { display: flex; flex-direction: column; gap: 18px; border: 1px solid var(--line); padding: 32px; }
        .field { display: flex; flex-direction: column; gap: 8px; }
        .field label { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
        .field input, .field textarea {
            width: 100%; padding: 13px 14px; border: 1px solid var(--line-strong); background: var(--bg);
            color: var(--ink); font: inherit; font-size: .95rem; border-radius: 0; transition: border-color .2s var(--ease);
        }
        .field input:focus, .field textarea:focus { border-color: var(--ink); outline: none; }
        .field textarea { resize: vertical; min-height: 120px; }
        .contact-banner { padding: 12px 16px; border: 1px solid; font-size: .9rem; }
        .contact-banner.success { border-color: #bfe3c4; background: #f1f8f1; color: #1f6f3b; }
        .contact-banner.error { border-color: #f0c9c6; background: #fcf2f1; color: #a83227; }

        /* product detail */
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: start; }
        .detail-media { border: 1px solid var(--line); background: var(--bg-soft); aspect-ratio: 1/1; display: grid; place-items: center; position: sticky; top: 96px; }
        .detail-media svg { max-width: 240px; }
        .detail-cat { font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-deep); }
        .detail-title { font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 600; letter-spacing: -.01em; margin: 10px 0 6px; }
        .detail-sub { color: var(--muted); }
        .detail-section { margin-top: 40px; }
        .detail-section h3 { font-size: .82rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
        .spec-table { width: 100%; border-collapse: collapse; }
        .spec-table th, .spec-table td { text-align: left; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
        .spec-table th { color: var(--muted); font-weight: 500; width: 40%; }
        .spec-table td { color: var(--ink); font-variant-numeric: tabular-nums; }
        .feature-list li { padding: 10px 0 10px 24px; position: relative; color: var(--ink-soft); font-size: .95rem; border-bottom: 1px solid var(--line); }
        .feature-list li::before { content: ""; position: absolute; left: 0; top: 18px; width: 12px; height: 1px; background: var(--gold); }
        .breadcrumb { font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 32px; }
        .breadcrumb a { color: var(--muted); }
        .breadcrumb a:hover { color: var(--ink); }
        .back-link { margin-top: 48px; }
        .back-link a { font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); border-bottom: 1px solid var(--ink); padding-bottom: 2px; }
        .back-link a:hover { color: var(--gold-deep); border-color: var(--gold); }

        /* news detail */
        .article-meta { color: var(--muted); font-size: .82rem; letter-spacing: .06em; margin-bottom: 24px; }
        .article-body { max-width: 760px; }
        .article-body p { margin: 0 0 1.2em; color: var(--ink-soft); }

        /* CTA band — bordered, not a color block */
        .cta-band { border: 1px solid var(--line); margin: 96px 0; }
        .cta-band-inner { display: flex; align-items: center; justify-content: space-between; gap: 32px; padding: 48px; flex-wrap: wrap; }

        /* footer */
        .site-footer { border-top: 1px solid var(--line); background: var(--bg); margin-top: 64px; }
        .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1.4fr; gap: 48px; padding: 64px 32px 32px; }
        .footer-brand .brand-mark { font-size: 1rem; }
        .footer-tagline { color: var(--muted); font-size: .88rem; margin-top: 12px; max-width: 38ch; }
        .footer-col h5 { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--ink); margin-bottom: 18px; }
        .footer-col ul li { padding: 7px 0; }
        .footer-col ul li a, .footer-col ul li { font-size: .88rem; color: var(--muted); }
        .footer-col ul li a:hover { color: var(--ink); }
        .footer-bottom { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-top: 1px solid var(--line); padding: 20px 32px; }
        .footer-bottom p { font-size: .78rem; color: var(--muted); }
        .footer-bottom .icp { color: var(--muted); }

        /* pagination */
        .pagination { display: flex; align-items: center; gap: 20px; margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line); }
        .pagination span { color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
        .pagination a { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); border-bottom: 1px solid var(--ink); padding-bottom: 2px; }
        .pagination a:hover { color: var(--gold-deep); border-color: var(--gold); }

        /* ---------- Tablet ---------- */
        @media (max-width: 1023px) {
            .section { padding: 72px 0; }
            .hero-inner { grid-template-columns: 1fr; gap: 40px; padding: 72px 0 64px; }
            .hero-visual { min-height: 260px; order: -1; }
            .about-intro { grid-template-columns: 1fr; gap: 32px; }
            .about-intro .left { position: static; }
            .about-stats { grid-template-columns: repeat(2, 1fr); }
            .about-stat:nth-child(2) { border-right: 0; }
            .about-stat:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
            .contact-grid { grid-template-columns: 1fr; gap: 40px; }
            .detail-grid { grid-template-columns: 1fr; gap: 40px; }
            .detail-media { position: static; }
            .footer-grid { grid-template-columns: 1fr 1fr; }
            .footer-brand { grid-column: 1 / -1; }
        }

        /* ---------- Mobile ---------- */
        @media (max-width: 639px) {
            .container { padding: 0 20px; }
            .section { padding: 56px 0; }
            .nav-toggle { display: block; }
            .brand-logo { height: 30px; }
            .site-nav {
                display: none; flex-direction: column; align-items: flex-start; gap: 18px;
                position: absolute; top: 72px; left: 0; right: 0;
                background: var(--bg); border-bottom: 1px solid var(--line); padding: 20px 20px 28px;
            }
            .header-inner.open .site-nav { display: flex; }
            .lang-switch { margin-left: 0; padding-left: 0; border-left: 0; margin-top: 8px; }
            .grid-3, .grid-2 { grid-template-columns: 1fr; }
            .product-grid { grid-template-columns: 1fr; }
            .factory-grid { grid-template-columns: 1fr; }
            .about-stats { grid-template-columns: 1fr; }
            .about-stat { border-right: 0; border-bottom: 1px solid var(--line); }
            .about-stat:last-child { border-bottom: 0; }
            .hero-stats { gap: 24px; flex-wrap: wrap; }
            .news-item a { grid-template-columns: 1fr; gap: 8px; }
            .news-item .arr { display: none; }
            .cta-band-inner { padding: 32px 20px; }
            .footer-grid { grid-template-columns: 1fr; gap: 32px; padding: 48px 20px 24px; }
            .footer-bottom { padding: 18px 20px; }
            .cat-block-head { flex-direction: column; align-items: flex-start; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
        }
    </style>
</head>
</html>

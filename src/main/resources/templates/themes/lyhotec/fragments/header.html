<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- 顶部导航 (README §10)。active 标记当前页。站内链接拼 localePrefix。 -->
<header th:fragment="header(siteName, active)" class="site-header" id="top">
    <div class="container header-inner">
        <a class="brand" th:href="@{${localePrefix + '/'}}">
            <img class="brand-logo" th:src="@{/themes-images/{tid}/images/lyhotec-logo.png(tid=${themeId})}" src="/themes-images/lyhotec/images/lyhotec-logo.png" th:alt="${siteName}" alt="LYHOTEC" width="36" height="36" />
            <span class="brand-text">
<!--                <span class="brand-mark" th:text="${siteName}">LYHOTEC</span>-->
                <span class="brand-tag" th:text="#{brand.tagline}">Home Cleaning Technology</span>
            </span>
        </a>
        <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" onclick="this.parentElement.classList.toggle('open');this.setAttribute('aria-expanded',this.parentElement.classList.contains('open'))">&#9776;</button>
        <nav class="site-nav" aria-label="Primary">
            <a th:href="@{${localePrefix + '/'}}" th:text="#{nav.home}" th:classappend="${active == 'index'} ? 'active' : ''">Home</a>
            <a th:href="@{${localePrefix + '/products'}}" th:text="#{nav.products}" th:classappend="${active == 'products'} ? 'active' : ''">Products</a>
            <a th:href="@{${localePrefix + '/news'}}" th:text="#{nav.news}" th:classappend="${active == 'news'} ? 'active' : ''">News</a>
            <a th:href="@{${localePrefix + '/about'}}" th:text="#{nav.about}" th:classappend="${active == 'about'} ? 'active' : ''">About</a>
            <a th:href="@{${localePrefix + '/contact'}}" th:text="#{nav.contact}" th:classappend="${active == 'contact'} ? 'active' : ''">Contact</a>
            <th:block th:replace="~{themes/__${themeId}__/fragments/language :: language(current=${currentLanguage}, languages=${languages})}"></th:block>
        </nav>
    </div>
</header>
</html>

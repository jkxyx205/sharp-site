<!DOCTYPE html>
<html th:lang="${currentLanguage}" th:dir="${currentLanguage == 'ar-SA' ? 'rtl' : 'ltr'}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{themes/__${themeId}__/fragments/head :: head(pageTitle=${pageTitle}, pageDescription=${pageDescription}, pageKeywords=${pageKeywords}, canonical=${canonical}, robots=${robots}, siteName=${siteName})}"></head>
<body>
<header th:replace="~{themes/__${themeId}__/fragments/header :: header(siteName=${siteName}, active='contact')}"></header>

<section class="container section contact">
    <h1 th:text="#{contact.title}">Contact</h1>
    <div id="contactSuccess" class="contact-banner success" hidden style="padding:12px 16px;margin-bottom:16px;border-radius:6px;background:#e7f4e4;color:#1f6f3b" th:text="#{contact.sent_success}">发送成功</div>
    <div id="contactError" class="contact-banner error" hidden style="padding:12px 16px;margin-bottom:16px;border-radius:6px;background:#fdecea;color:#a83227" th:text="#{contact.sent_failed}">发送失败</div>
    <div class="contact-grid">
        <div th:if="${config != null}">
            <p th:if="${config.address != null}" th:text="${config.address}">Address</p>
            <p th:if="${config.phone != null}" th:text="|#{common.tel}: ${config.phone}|">Tel</p>
            <p th:if="${config.mobile != null}" th:text="|#{common.mobile}: ${config.mobile}|">Mobile</p>
            <p th:if="${config.email != null}">
                <a th:href="'mailto:' + ${config.email}" th:text="${config.email}">email</a>
            </p>
            <p th:if="${config.whatsapp != null}" th:text="|#{common.whatsapp}: ${config.whatsapp}|">WhatsApp</p>
        </div>
        <form class="contact-form" method="post" action="/contact">
            <label><span th:text="#{contact.name}">Name</span> <input type="text" name="name" required /></label>
            <label><span th:text="#{contact.email}">Email</span> <input type="email" name="email" required /></label>
            <label><span th:text="#{contact.message}">Message</span> <textarea name="message" rows="5" required></textarea></label>
            <button type="submit" class="btn btn-primary" th:text="#{contact.send}">Send</button>
        </form>
    </div>
</section>

<footer th:replace="~{themes/__${themeId}__/fragments/footer :: footer(siteName=${siteName}, config=${config})}"></footer>
<script>
(function () {
    var form = document.querySelector('.contact-form');
    if (!form) return;
    var ok = document.getElementById('contactSuccess');
    var no = document.getElementById('contactError');
    function show(el) { if (el) el.hidden = false; }
    function hide(el) { if (el) el.hidden = true; }
    form.addEventListener('submit', function (e) {
        e.preventDefault();
        hide(ok); hide(no);
        var btn = form.querySelector('button[type=submit]');
        if (btn) btn.disabled = true;
        fetch(form.action, { method: 'POST', body: new FormData(form), headers: { 'Accept': 'application/json' } })
            .then(function (r) { return r.json(); })
            .then(function (d) { if (d && d.success) { show(ok); form.reset(); } else { show(no); } })
            .catch(function () { show(no); })
            .finally(function () { if (btn) btn.disabled = false; });
    });
})();
</script>
</body>
</html>

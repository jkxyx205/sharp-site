<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- 公共 <head>:charset/viewport + SEO + 主题样式(内联)。
     样式内联进模板,使静态发布产物自带样式,不依赖外部 CSS 文件路径
     (Nginx 静态站点不再经 Spring app 提供 static/themes/modern/css)。 -->
<head th:fragment="head(pageTitle, pageDescription, pageKeywords, canonical, robots, siteName)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <th:block th:replace="~{themes/modern/fragments/seo :: seo(title=${pageTitle}, description=${pageDescription}, keywords=${pageKeywords}, canonical=${canonical}, robots=${robots}, siteName=${siteName})}"></th:block>
    <style>
        /* modern theme — responsive (TASK-0202 / TASK-0203)
           断点:mobile < 640px,tablet 640–1023px,desktop >= 1024px。 */
        :root {
            --c-primary: #1f6feb;
            --c-text: #1f2937;
            --c-muted: #6b7280;
            --c-bg: #ffffff;
            --c-bg-alt: #f8fafc;
            --c-border: #e5e7eb;
            --radius: 8px;
            --max-width: 1200px;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--c-text);
            background: var(--c-bg);
            line-height: 1.6;
        }
        a { color: var(--c-primary); text-decoration: none; }
        a:hover { text-decoration: underline; }
        img { max-width: 100%; height: auto; }
        .container { width: 100%; max-width: var(--max-width); margin: 0 auto; padding: 0 16px; }
        .section { padding: 32px 0; }
        .empty { color: var(--c-muted); }
        .rich-text { max-width: 760px; }
        .back { margin-top: 24px; }
        /* header */
        .site-header { border-bottom: 1px solid var(--c-border); background: var(--c-bg); position: sticky; top: 0; z-index: 10; }
        .header-inner { display: flex; align-items: center; justify-content: space-between; min-height: 56px; gap: 12px; }
        .brand { font-weight: 700; font-size: 1.2rem; color: var(--c-text); }
        .site-nav { display: flex; gap: 16px; }
        .site-nav a { color: var(--c-text); }
        .site-nav a.active { color: var(--c-primary); font-weight: 600; }
        .nav-toggle { display: none; background: none; border: none; font-size: 1.4rem; cursor: pointer; }
        /* hero */
        .hero { background: linear-gradient(135deg, #1f6feb, #0ea5e9); color: #fff; padding: 64px 0; text-align: center; }
        .hero h1 { font-size: 2.2rem; margin: 0 0 12px; }
        .hero-sub { color: rgba(255,255,255,.9); margin-bottom: 24px; }
        /* buttons */
        .btn { display: inline-block; padding: 10px 20px; border-radius: var(--radius); background: #fff; color: var(--c-primary); font-weight: 600; }
        .btn:hover { text-decoration: none; opacity: .92; }
        .btn-primary { background: var(--c-primary); color: #fff; }
        /* product grid */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .product-card { border: 1px solid var(--c-border); border-radius: var(--radius); overflow: hidden; background: var(--c-bg); transition: box-shadow .2s; }
        .product-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08); }
        .product-card a { color: var(--c-text); }
        .product-card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; }
        .product-card h3 { margin: 12px 12px 4px; font-size: 1.05rem; }
        .product-card p { margin: 0 12px 12px; color: var(--c-muted); font-size: .9rem; }
        /* news list */
        .news-list { list-style: none; padding: 0; }
        .news-list li { padding: 12px 0; border-bottom: 1px solid var(--c-border); display: flex; justify-content: space-between; gap: 12px; }
        .news-list li span { color: var(--c-muted); font-size: .85rem; white-space: nowrap; }
        /* cta */
        .cta { background: var(--c-bg-alt); text-align: center; padding: 48px 0; }
        /* contact */
        .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
        .contact-form { display: flex; flex-direction: column; gap: 12px; }
        .contact-form input, .contact-form textarea { width: 100%; padding: 10px; border: 1px solid var(--c-border); border-radius: var(--radius); font: inherit; }
        .contact-form button { align-self: flex-start; }
        /* footer */
        .site-footer { border-top: 1px solid var(--c-border); background: var(--c-bg-alt); padding: 24px 0; margin-top: 32px; }
        .footer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .site-footer h4 { margin: 0 0 8px; font-size: 1rem; }
        .site-footer p { margin: 4px 0; font-size: .9rem; color: var(--c-muted); }
        /* lang switch */
        .lang-switch { font-size: .85rem; color: var(--c-muted); }
        .lang-switch a.active { font-weight: 600; }
        /* product detail */
        .product-detail .cover { max-width: 480px; margin-bottom: 16px; border-radius: var(--radius); }
        .subtitle { color: var(--c-muted); }
        /* ---------- Tablet ---------- */
        @media (max-width: 1023px) {
            .hero { padding: 48px 0; }
            .hero h1 { font-size: 1.9rem; }
            .contact-grid { grid-template-columns: 1fr; }
        }
        /* ---------- Mobile ---------- */
        @media (max-width: 639px) {
            .nav-toggle { display: block; }
            .site-nav {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 56px;
                left: 0;
                right: 0;
                background: var(--c-bg);
                border-bottom: 1px solid var(--c-border);
                padding: 8px 16px 16px;
            }
            .header-inner.open .site-nav { display: flex; }
            .hero { padding: 36px 0; }
            .hero h1 { font-size: 1.6rem; }
            .product-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            .section { padding: 24px 0; }
            .news-list li { flex-direction: column; }
        }
    </style>
</head>
</html>

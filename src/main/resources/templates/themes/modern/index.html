<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{themes/modern/fragments/head :: head(pageTitle=${pageTitle}, pageDescription=${pageDescription}, pageKeywords=${pageKeywords}, canonical=${canonical}, robots=${robots}, siteName=${siteName})}"></head>
<body>
<header th:replace="~{themes/modern/fragments/header :: header(siteName=${siteName}, active='index')}"></header>

<section class="hero">
    <div class="container">
        <h1 th:text="${tagline} ?: ${siteName}">Welcome</h1>
        <p class="hero-sub" th:text="${intro} ?: ''">We are a foreign-trade company.</p>
        <a class="btn" th:href="@{/products}">View Products</a>
    </div>
</section>

<section class="container section">
    <h2>About Us</h2>
    <p th:text="${aboutTeaser} ?: ''">Brief company intro.</p>
    <a th:href="@{/about}">Read more →</a>
</section>

<section class="container section">
    <h2>Featured Products</h2>
    <div class="product-grid" th:if="${products != null and !products.isEmpty()}">
        <article class="product-card" th:each="p : ${products}">
            <a th:href="@{'/products/' + ${p.slug}}">
                <img th:if="${p.cover != null}" th:src="${p.cover}" th:alt="${p.name}" src="" />
                <h3 th:text="${p.name}">Product</h3>
                <p th:if="${p.subtitle != null}" th:text="${p.subtitle}"></p>
            </a>
        </article>
    </div>
    <p th:if="${products == null or products.isEmpty()}" class="empty">No products yet.</p>
</section>

<section class="container section">
    <h2>Latest News</h2>
    <ul class="news-list" th:if="${news != null and !news.isEmpty()}">
        <li th:each="a : ${news}">
            <a th:href="@{'/news/' + ${a.slug}}" th:text="${a.title}">News title</a>
            <span th:if="${a.publishTime != null}" th:text="${#temporals.format(a.publishTime, 'yyyy-MM-dd')}"></span>
        </li>
    </ul>
    <p th:if="${news == null or news.isEmpty()}" class="empty">No news yet.</p>
</section>

<section class="cta">
    <div class="container">
        <h2 th:text="${ctaTitle} ?: 'Ready to work with us?'">Ready to work with us?</h2>
        <a class="btn btn-primary" th:href="@{/contact}">Contact Us</a>
    </div>
</section>

<footer th:replace="~{themes/modern/fragments/footer :: footer(siteName=${siteName}, config=${config})}"></footer>
</body>
</html>

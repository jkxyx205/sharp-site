<!DOCTYPE html>
<html th:lang="${currentLanguage}" th:dir="${currentLanguage == 'ar-SA' ? 'rtl' : 'ltr'}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{themes/__${themeId}__/fragments/head :: head(pageTitle=${pageTitle}, pageDescription=${pageDescription}, pageKeywords=${pageKeywords}, canonical=${canonical}, robots=${robots}, siteName=${siteName})}"></head>
<body>
<header th:replace="~{themes/__${themeId}__/fragments/header :: header(siteName=${siteName}, active='index')}"></header>

<section class="hero">
    <div class="container">
        <h1 th:text="#{home.hero.title}">Welcome</h1>
        <p class="hero-sub" th:text="#{home.hero.subtitle}">We are a foreign-trade company.</p>
        <a class="btn" th:href="@{${localePrefix + '/products'}}" th:text="#{home.products.btn}">View Products</a>
    </div>
</section>

<section class="container section">
    <h2 th:text="#{home.about.title}">About Us</h2>
    <p th:text="#{home.about.teaser}">Brief company intro.</p>
    <a th:href="@{${localePrefix + '/about'}}" th:text="#{home.about.readmore}">Read more →</a>
</section>

<section class="container section">
    <h2 th:text="#{home.featured.title}">Featured Products</h2>
    <div class="product-grid" th:if="${products != null and !products.isEmpty()}">
        <article class="product-card" th:each="p : ${products}">
            <a th:href="@{${localePrefix + '/products/' + p.slug}}">
                <img th:if="${p.cover != null}" th:src="${p.cover}" th:alt="${p.name}" src="" />
                <h3 th:text="${p.name}">Product</h3>
                <p th:if="${p.subtitle != null}" th:text="${p.subtitle}"></p>
            </a>
        </article>
    </div>
    <p th:if="${products == null or products.isEmpty()}" class="empty" th:text="#{product.empty}">No products yet.</p>
</section>

<section class="container section">
    <h2 th:text="#{home.news.title}">Latest News</h2>
    <ul class="news-list" th:if="${news != null and !news.isEmpty()}">
        <li th:each="a : ${news}">
            <a th:href="@{${localePrefix + '/news/' + a.slug}}" th:text="${a.title}">News title</a>
            <span th:if="${a.publishTime != null}" th:text="${#temporals.format(a.publishTime, 'yyyy-MM-dd')}"></span>
        </li>
    </ul>
    <p th:if="${news == null or news.isEmpty()}" class="empty" th:text="#{news.empty}">No news yet.</p>
</section>

<section class="cta">
    <div class="container">
        <h2 th:text="#{home.cta.title}">Ready to work with us?</h2>
        <a class="btn btn-primary" th:href="@{${localePrefix + '/contact'}}" th:text="#{home.cta.btn}">Contact Us</a>
    </div>
</section>

<section>
    <h1>test 分类</h1>
    <th:block th:if="${allProducts != null}" th:with="gallery=${allProducts.?[categorySlug == 'test']}">
        <section class="container section" th:if="${!gallery.isEmpty()}">
            <h2 th:text="${gallery[0].categoryName}">Gallery</h2>
            <div class="product-grid">
                <a class="product-card" th:each="p : ${gallery}" th:href="@{${localePrefix + '/products/' + p.slug}}">
                    <img th:if="${p.cover != null}" th:src="${p.cover}" th:alt="${p.name}" src="" loading="lazy" />
                    <h3 th:text="${p.name}">Product</h3>
                </a>
            </div>
        </section>
    </th:block>
</section>

<footer th:replace="~{themes/__${themeId}__/fragments/footer :: footer(siteName=${siteName}, config=${config})}"></footer>
</body>
</html>

<!DOCTYPE html>
<html th:lang="${currentLanguage}" th:dir="${currentLanguage == 'ar-SA' ? 'rtl' : 'ltr'}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{themes/modern/fragments/head :: head(pageTitle=${pageTitle}, pageDescription=${pageDescription}, pageKeywords=${pageKeywords}, canonical=${canonical}, robots=${robots}, siteName=${siteName})}"></head>
<body>
<header th:replace="~{themes/modern/fragments/header :: header(siteName=${siteName}, active='news')}"></header>

<section class="container section">
    <h1 th:text="#{news.title}">News</h1>
    <ul class="news-list" th:if="${news != null and !news.isEmpty()}">
        <li th:each="a : ${news}">
            <a th:href="@{${localePrefix + '/news/' + a.slug}}" th:text="${a.title}">News title</a>
            <span th:if="${a.publishTime != null}" th:text="${#temporals.format(a.publishTime, 'yyyy-MM-dd')}"></span>
        </li>
    </ul>
    <p th:if="${news == null or news.isEmpty()}" class="empty" th:text="#{news.empty}">No news yet.</p>
    <nav class="pagination" th:if="${totalPages != null and totalPages > 1}">
        <a th:if="${prevLink != null}" th:href="${prevLink}" th:text="#{page.prev}">‹ Previous</a>
        <span th:text="${page + ' / ' + totalPages}">1 / 1</span>
        <a th:if="${nextLink != null}" th:href="${nextLink}" th:text="#{page.next}">Next ›</a>
    </nav>
</section>

<th:block th:if="${news != null}" th:with="cnews=${news.?[categorySlug == 'c-news']}">
    <section class="container section" th:if="${!cnews.isEmpty()}">
        <h2 th:text="${cnews[0].categoryName}">c-news</h2>
        <ul class="news-list">
            <li th:each="a : ${cnews}">
                <a th:href="@{${localePrefix + '/news/' + a.slug}}" th:text="${a.title}">News title</a>
                <span th:if="${a.publishTime != null}" th:text="${#temporals.format(a.publishTime, 'yyyy-MM-dd')}"></span>
            </li>
        </ul>
    </section>
</th:block>

<th:block th:if="${categories != null and news != null}" th:with="slugs=${news.![categorySlug]}">
    <th:block th:each="cat : ${categories}">
        <section class="container section" th:if="${#lists.contains(slugs, cat.slug)}">
            <h2 th:text="${cat.name}">Category</h2>
            <ul class="news-list">
                <li th:each="a : ${news}" th:if="${a.categorySlug == cat.slug}">
                    <a th:href="@{${localePrefix + '/news/' + a.slug}}" th:text="${a.title}">News title</a>
                    <span th:if="${a.publishTime != null}" th:text="${#temporals.format(a.publishTime, 'yyyy-MM-dd')}"></span>
                </li>
            </ul>
        </section>
    </th:block>
</th:block>

<footer th:replace="~{themes/modern/fragments/footer :: footer(siteName=${siteName}, config=${config})}"></footer>
</body>
</html>

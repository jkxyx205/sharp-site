<!DOCTYPE html>
<html th:lang="${currentLanguage}" th:dir="${currentLanguage == 'ar-SA' ? 'rtl' : 'ltr'}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{themes/modern/fragments/head :: head(pageTitle=${pageTitle}, pageDescription=${pageDescription}, pageKeywords=${pageKeywords}, canonical=${canonical}, robots=${robots}, siteName=${siteName})}"></head>
<body>
<header th:replace="~{themes/modern/fragments/header :: header(siteName=${siteName}, active='products')}"></header>

<section class="container section">
    <h1 th:text="#{product.title}">Products</h1>
    <div class="product-grid" th:if="${products != null and !products.isEmpty()}">
        <article class="product-card" th:each="p : ${products}">
            <a th:href="@{${localePrefix + '/products/' + p.slug}}">
                <img th:if="${p.cover != null}" th:src="${p.cover}" th:alt="${p.name}" src="" />
                <h3 th:text="${p.name}">Product</h3>
                <p th:if="${p.subtitle != null}" th:text="${p.subtitle}"></p>
            </a>
        </article>
    </div>
    <p th:if="${products == null or products.isEmpty()}" class="empty" th:text="#{product.empty}">No products yet.</p>
    <nav class="pagination" th:if="${totalPages != null and totalPages > 1}">
        <a th:if="${prevLink != null}" th:href="${prevLink}" th:text="#{page.prev}">‹ Previous</a>
        <span th:text="${page + ' / ' + totalPages}">1 / 1</span>
        <a th:if="${nextLink != null}" th:href="${nextLink}" th:text="#{page.next}">Next ›</a>
    </nav>
</section>

<footer th:replace="~{themes/modern/fragments/footer :: footer(siteName=${siteName}, config=${config})}"></footer>
</body>
</html>

        <!-- live/static pagination guard -->
        <nav class="pagination" th:if="${totalPages != null and totalPages > 1}">
            <a th:if="${prevLink != null}" th:href="${prevLink}" th:text="'‹ 上一页'">‹ Previous</a>
            <span th:text="${page + ' / ' + totalPages}">1 / 1</span>
            <a th:if="${nextLink != null}" th:href="${nextLink}" th:text="'下一页 ›'">Next ›</a>
        </nav>

        <!-- live DB-driven fallback list (三路渲染一致;无数据时隐藏) -->
        <th:block th:if="${news != null and !news.isEmpty()}">
            <div class="news-grid" style="margin-top:24px">
                <a class="news-card" th:each="a : ${news}" th:href="@{${localePrefix + '/news/' + a.slug}}">
                    <div class="meta"><span class="chip" th:if="${a.categoryName != null}" th:text="${a.categoryName}">Cat</span><span th:if="${a.publishTime != null}" th:text="${#temporals.format(a.publishTime, 'yyyy-MM-dd')}"></span></div>
                    <h3 th:text="${a.title}">Title</h3>
                    <p th:if="${a.summary != null}" th:text="${a.summary}"></p>
                    <span class="more" th:text="'阅读 →'">Read →</span>
                </a>
            </div>

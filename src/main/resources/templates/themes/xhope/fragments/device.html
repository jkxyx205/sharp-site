<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- 产品渲染图:CSS stage 内的 inline SVG 线条剪影(浅灰舞台上的深墨线稿,黑白灰)。
     用于 index/products 页面,浅色 stage 上展示。 -->
<svg th:fragment="vacuum" class="device" viewBox="0 0 200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="xhop-body" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#eef2f7"/><stop offset="1" stop-color="#dde3ec"/>
        </linearGradient>
        <linearGradient id="xhop-acc" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#0a0a0a"/><stop offset="1" stop-color="#3f3f46"/>
        </linearGradient>
    </defs>
    <g stroke="#202733" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="88" y="36" width="24" height="118" rx="10" fill="url(#xhop-body)"/>
        <rect x="70" y="150" width="60" height="48" rx="16" fill="url(#xhop-body)"/>
        <path d="M70 168 q-22 4 -22 24"/>
        <rect x="86" y="198" width="28" height="18" rx="4" fill="#cfd6e0"/>
        <path d="M50 216 h100 l-12 24 h-76 z" fill="#e3e8ef"/>
    </g>
    <circle cx="100" cy="174" r="10" fill="none" stroke="url(#xhop-acc)" stroke-width="2.4"/>
    <circle cx="100" cy="174" r="3.4" fill="#0a0a0a"/>
</svg>

<svg th:fragment="fabric" class="device" viewBox="0 0 200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="xhop-body2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#eef2f7"/><stop offset="1" stop-color="#dde3ec"/>
        </linearGradient>
        <linearGradient id="xhop-acc2" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#0a0a0a"/><stop offset="1" stop-color="#3f3f46"/>
        </linearGradient>
    </defs>
    <g stroke="#202733" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <!-- canister -->
        <rect x="40" y="150" width="120" height="78" rx="20" fill="url(#xhop-body2)"/>
        <rect x="40" y="150" width="120" height="22" rx="16" fill="#cfd6e0"/>
        <!-- handle -->
        <path d="M70 150 v-22 h60 v22"/>
        <!-- wand -->
        <rect x="92" y="60" width="16" height="92" rx="8" fill="url(#xhop-body2)"/>
        <path d="M100 60 q40 -8 56 -22"/>
        <!-- brush head -->
        <rect x="140" y="18" width="44" height="22" rx="6" fill="#e3e8ef"/>
    </g>
    <circle cx="100" cy="189" r="9" fill="none" stroke="url(#xhop-acc2)" stroke-width="2.4"/>
    <circle cx="100" cy="189" r="3.2" fill="#0a0a0a"/>
</svg>

<svg th:fragment="sweeper" class="device" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="xhop-body3" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#eef2f7"/><stop offset="1" stop-color="#dde3ec"/>
        </linearGradient>
        <linearGradient id="xhop-acc3" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#0a0a0a"/><stop offset="1" stop-color="#3f3f46"/>
        </linearGradient>
    </defs>
    <circle cx="100" cy="100" r="82" fill="url(#xhop-body3)" stroke="#cfd6e0" stroke-width="2"/>
    <circle cx="100" cy="100" r="82" fill="none" stroke="url(#xhop-acc3)" stroke-width="1.4" opacity=".5"/>
    <circle cx="100" cy="100" r="40" fill="#e3e8ef" stroke="#cfd6e0" stroke-width="2"/>
    <circle cx="100" cy="100" r="20" fill="none" stroke="url(#xhop-acc3)" stroke-width="2.4"/>
    <circle cx="100" cy="100" r="6" fill="#0a0a0a"/>
    <!-- direction mark -->
    <path d="M100 18 l10 -10 l-20 0 z" fill="#3f3f46" opacity=".85"/>
</svg>

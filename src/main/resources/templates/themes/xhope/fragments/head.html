<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- xhope theme <head>: charset/viewport + SEO + inline design system (黑白灰 / shadcn 风)。
     样式内联,使静态发布产物自带样式,不依赖外部 CSS。 -->
<head th:fragment="head(pageTitle, pageDescription, pageKeywords, canonical, robots, siteName)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <th:block th:replace="~{themes/xhope/fragments/seo :: seo(title=${pageTitle}, description=${pageDescription}, keywords=${pageKeywords}, canonical=${canonical}, robots=${robots}, siteName=${siteName})}"></th:block>
    <style>
        /* ============================================================
           XHOPE design system — monochrome (black / white / gray), shadcn-ish
           断点: mobile < 640 · tablet 640–1023 · desktop >= 1024
           仅黑白灰;按钮直角;细 1px 边框;克制阴影;大量留白。
           ============================================================ */
        :root {
            --x-white: #ffffff;
            --x-black: #0a0a0a;
            --x-ink:   #0a0a0a;   /* 正文 / primary */
            --x-ink-2: #3f3f46;   /* 次级文字 (zinc-700) */
            --x-muted: #71717a;   /* 弱化文字 (zinc-500) */
            --x-faint: #a1a1aa;   /* 最弱 (zinc-400) */
            --x-line:        #e4e4e7; /* 边框 (zinc-200) */
            --x-line-strong: #d4d4d8; /* 略深边框 (zinc-300) */
            --x-light: #fafafa;   /* 交替板块底 (zinc-50) */
            --x-tint:  #f4f4f5;    /* stage / 卡片底 (zinc-100) */

            --x-max: 1240px;
            --x-pad: 24px;
            --x-fs-base: 16px;
            --x-radius: 10px;    /* 卡片/输入等小圆角;按钮恒为 0 */
            --x-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.06);
            --x-ring: 0 0 0 3px rgba(0,0,0,.10);   /* focus 环 */
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

        figure {
            margin: 0;
        }

        body {
            margin: 0;
            font: 400 var(--x-fs-base)/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", "Source Han Sans SC", "Noto Sans SC", Arial, sans-serif;
            color: var(--x-ink);
            background: var(--x-white);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }
        a { color: inherit; text-decoration: none; }
        img { max-width: 100%; height: auto; display: block; }
        h1, h2, h3, h4, p { margin: 0; }

        /* layout */
        .container { width: 100%; max-width: var(--x-max); margin: 0 auto; padding: 0 var(--x-pad); }
        .section { padding: 104px 0; position: relative; overflow: hidden; }
        .section--light { background: var(--x-white); }
        .section--alt   { background: var(--x-light); }
        .eyebrow {
            font-size: .72rem; font-weight: 600; letter-spacing: .22em; text-transform: uppercase;
            color: var(--x-muted);
        }
        .section-head { max-width: 760px; margin-bottom: 56px; }
        .section-head h2 {
            font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1.06; font-weight: 600;
            letter-spacing: -0.02em; margin-top: 16px; color: var(--x-ink);
        }
        .section-head p { margin-top: 18px; color: var(--x-muted); font-size: 1.08rem; max-width: 60ch; }

        /* buttons — 直角,仅黑白灰 */
        .btn {
            display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
            font: inherit; font-weight: 600; font-size: .95rem; letter-spacing: .01em;
            padding: 13px 26px; border-radius: 0; border: 1px solid transparent;
            transition: background .2s, color .2s, border-color .2s, box-shadow .2s;
        }
        .btn-accent { background: var(--x-ink); color: var(--x-white); }
        .btn-accent:hover { background: #262629; }
        .btn-ghost { background: var(--x-white); color: var(--x-ink); border-color: var(--x-line-strong); }
        .btn-ghost:hover { background: var(--x-light); border-color: var(--x-ink-2); }
        .btn-light { background: var(--x-white); color: var(--x-ink); border: 1px solid var(--x-line-strong); }
        .btn-light:hover { background: var(--x-light); border-color: var(--x-ink-2); box-shadow: var(--x-shadow); }

        /* ---------- header ---------- */
        .site-header {
            position: sticky; top: 0; z-index: 50;
            background: rgba(255,255,255,.82); backdrop-filter: saturate(180%) blur(18px);
            -webkit-backdrop-filter: saturate(180%) blur(18px);
            border-bottom: 1px solid var(--x-line); color: var(--x-ink);
        }
        .header-inner { display: flex; align-items: center; justify-content: space-between; min-height: 68px; gap: 16px; }
        .brand { display: inline-flex; align-items: baseline; gap: 10px; font-weight: 700; font-size: 1.3rem; letter-spacing: .04em; color: var(--x-ink); }
        .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--x-ink); display: inline-block; }
        .brand small { font-weight: 400; font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; color: var(--x-muted); }
        .site-nav { display: flex; align-items: center; gap: 30px; }
        .site-nav a { font-size: .92rem; color: var(--x-ink-2); transition: color .2s; position: relative; }
        .site-nav a.btn-accent {color: var(--x-white);}
        .site-nav a:hover { color: var(--x-ink); }
        .site-nav a.active { color: var(--x-ink); }
        .site-nav a.active::after {
            content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 2px;
            background: var(--x-ink);
        }
        .nav-cta { margin-left: 8px; }
        .nav-toggle { display: none; background: none; border: 0; color: var(--x-ink); font-size: 1.6rem; cursor: pointer; line-height: 1; }

        /* ---------- hero ---------- */
        .hero {
            position: relative; color: var(--x-ink); overflow: hidden;
            background: var(--x-white);
            padding: 132px 0 96px;
        }
        .hero::before { /* 极淡灰光晕,无彩色 */
            content: ""; position: absolute; inset: 0;
            background:
                radial-gradient(50% 45% at 78% 28%, rgba(0,0,0,.05), transparent 62%),
                radial-gradient(46% 46% at 16% 72%, rgba(0,0,0,.04), transparent 65%);
        }
        .hero::after { /* faint grid */
            content: ""; position: absolute; inset: 0; opacity: .5;
            background-image: linear-gradient(rgba(0,0,0,.045) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0,0,0,.045) 1px, transparent 1px);
            background-size: 64px 64px;
            -webkit-mask-image: radial-gradient(circle at 50% 30%, #000, transparent 70%);
            mask-image: radial-gradient(circle at 50% 30%, #000, transparent 70%);
        }
        .hero .container { position: relative; z-index: 1; display: grid; grid-template-columns: 1.05fr .95fr; gap: 56px; align-items: center; }
        .hero .eyebrow { color: var(--x-muted); }
        .hero h1 {
            font-size: clamp(2.6rem, 7vw, 5.2rem); line-height: .98; font-weight: 600;
            letter-spacing: -0.03em; margin: 22px 0 24px; color: var(--x-ink);
        }
        .hero h1 .accent { color: var(--x-muted); font-weight: 500; }
        .hero-sub { color: var(--x-muted); font-size: 1.16rem; max-width: 50ch; line-height: 1.55; }
        .hero-actions { display: flex; gap: 14px; margin-top: 34px; flex-wrap: wrap; }
        .hero-specs { display: flex; gap: 36px; margin-top: 44px; flex-wrap: wrap; }
        .hero-specs .num { font-size: 1.7rem; font-weight: 600; letter-spacing: -.01em; color: var(--x-ink); }
        .hero-specs .lbl { font-size: .8rem; color: var(--x-muted); letter-spacing: .04em; }

        /* product stage — 浅灰舞台 + 极淡灰光晕 */
        .stage {
            position: relative; aspect-ratio: 1/1; display: grid; place-items: center;
            border-radius: var(--x-radius);
            background: radial-gradient(circle at 50% 42%, #ffffff 0%, var(--x-tint) 75%);
            border: 1px solid var(--x-line);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.8), 0 30px 60px rgba(0,0,0,.06);
        }
        .stage .halo {
            position: absolute; width: 78%; height: 78%; border-radius: 50%;
            background: radial-gradient(circle, rgba(0,0,0,.08), transparent 70%);
            filter: blur(8px); animation: pulse 4.5s ease-in-out infinite;
        }
        .stage .ring { position: absolute; width: 86%; height: 86%; border-radius: 50%; border: 1px solid var(--x-line); }
        .stage .ring.r2 { width: 64%; height: 64%; border-color: var(--x-line-strong); }
        .stage svg.device { position: relative; z-index: 1; width: 60%; height: auto; filter: drop-shadow(0 22px 40px rgba(0,0,0,.14)); }
        @keyframes pulse { 0%,100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }

        /* ---------- feature/category grid ---------- */
        .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
        .cat-card {
            position: relative; display: flex; flex-direction: column; gap: 18px;
            padding: 28px; border-radius: var(--x-radius); overflow: hidden;
            background: var(--x-white); border: 1px solid var(--x-line);
            transition: border-color .25s, box-shadow .25s;
        }
        .cat-card:hover { border-color: var(--x-ink); box-shadow: var(--x-shadow); }
        .cat-card .mini-stage {
            aspect-ratio: 4/3; border-radius: 8px; display: grid; place-items: center;
            background: radial-gradient(circle at 50% 40%, #ffffff, var(--x-tint)); border: 1px solid var(--x-line);
            overflow: hidden;
        }
        .cat-card .mini-stage svg { width: 52%; height: auto; }
        .cat-card .mini-stage img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .cat-card h3 { font-size: 1.32rem; font-weight: 600; letter-spacing: -.01em; color: var(--x-ink); }
        .cat-card p { color: var(--x-muted); font-size: .96rem; }
        .cat-card .link { margin-top: auto; font-weight: 600; font-size: .9rem; color: var(--x-ink); }
        .cat-card .tag { position: absolute; top: 20px; right: 20px; font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--x-muted); }

        /* ---------- motor highlight ---------- */
        .motor-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 56px; align-items: center; }
        .motor-vis { aspect-ratio: 1/1; position: relative; display: grid; place-items: center; }
        .motor-vis .core {
            position: relative; width: 46%; aspect-ratio: 1/1; border-radius: 50%;
            background: conic-gradient(from 0deg, var(--x-black), #52525b, var(--x-black));
            filter: blur(1px); animation: spin 6s linear infinite;
            box-shadow: 0 0 60px rgba(0,0,0,.22);
        }
        .motor-vis .core::after { content: ""; position: absolute; inset: 22%; border-radius: 50%; background: var(--x-light); }
        .motor-vis .ring { position: absolute; border-radius: 50%; border: 1px solid var(--x-line); }
        .motor-vis .ring.a { width: 70%; height: 70%; }
        .motor-vis .ring.b { width: 90%; height: 90%; border-style: dashed; border-color: var(--x-line-strong); animation: spin 18s linear infinite reverse; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .stat-row { display: flex; gap: 40px; margin-top: 40px; flex-wrap: wrap; }
        .stat .num { font-size: clamp(1.8rem, 3vw, 2.6rem); font-weight: 600; letter-spacing: -.02em; color: var(--x-ink); }
        .stat .lbl { color: var(--x-muted); font-size: .85rem; letter-spacing: .03em; margin-top: 6px; }

        /* ---------- product long section ---------- */
        .p-block { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }
        .p-block + .p-block { margin-top: 120px; }
        .p-block.flip .p-media { order: 2; }
        .p-media { position: relative; }
        .p-media .stage { aspect-ratio: 5/6; }
        .p-media .stage svg.device { width: 56%; }
        .p-eyebrow { font-size: .72rem; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--x-muted); }
        .p-name { font-size: clamp(2rem, 4.4vw, 3.1rem); font-weight: 600; letter-spacing: -.02em; line-height: 1.05; margin: 16px 0 10px; color: var(--x-ink); }
        .p-tag { display: inline-block; font-size: .76rem; letter-spacing: .08em; padding: 5px 12px; border-radius: 4px; border: 1px solid var(--x-line-strong); color: var(--x-muted); margin-bottom: 22px; }
        .p-lead { color: var(--x-muted); font-size: 1.05rem; max-width: 52ch; }
        .spec-table { margin-top: 32px; border-top: 1px solid var(--x-line); }
        .spec-table .row { display: grid; grid-template-columns: 1fr auto; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--x-line); align-items: baseline; }
        .spec-table .k { font-size: .9rem; color: var(--x-muted); }
        .spec-table .v { font-weight: 600; font-size: 1rem; color: var(--x-ink); }
        .p-actions { display: flex; gap: 14px; margin-top: 34px; flex-wrap: wrap; }

        /* ---------- news cards ---------- */
        .news-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
        .news-card {
            display: flex; flex-direction: column; gap: 14px; padding: 28px;
            border-radius: var(--x-radius); border: 1px solid var(--x-line);
            background: var(--x-white); transition: border-color .25s, box-shadow .25s;
        }
        .news-card:hover { border-color: var(--x-ink); box-shadow: var(--x-shadow); }
        .news-card .meta { display: flex; gap: 12px; align-items: center; font-size: .8rem; color: var(--x-muted); }
        .news-card .chip { color: var(--x-ink); font-weight: 600; letter-spacing: .04em; }
        .news-card h3 { font-size: 1.22rem; font-weight: 600; line-height: 1.25; letter-spacing: -.01em; color: var(--x-ink); }
        .news-card p { color: var(--x-muted); font-size: .94rem; }
        .news-card .more { margin-top: auto; font-weight: 600; font-size: .88rem; color: var(--x-ink); }

        /* ---------- CTA band ---------- */
        .cta-band { background: var(--x-light); color: var(--x-ink); padding: 96px 0; position: relative; overflow: hidden; border-top: 1px solid var(--x-line); border-bottom: 1px solid var(--x-line); }
        .cta-band::before { content:""; position:absolute; inset:0; background: radial-gradient(60% 80% at 82% 50%, rgba(0,0,0,.06), transparent 65%); }
        .cta-band .container { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 32px; flex-wrap: wrap; }
        .cta-band h2 { font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 600; letter-spacing: -.02em; color: var(--x-ink); }
        .cta-band p { color: var(--x-muted); }

        /* ---------- contact ---------- */
        .contact-grid { display: grid; grid-template-columns: .9fr 1.1fr; gap: 56px; align-items: start; }
        .info-list { margin-top: 28px; display: flex; flex-direction: column; gap: 22px; }
        .info-list .row { display: flex; gap: 14px; align-items: baseline; }
        .info-list .k { font-size: .76rem; letter-spacing: .14em; text-transform: uppercase; color: var(--x-muted); min-width: 92px; }
        .info-list .v { font-size: 1rem; color: var(--x-ink); }
        .info-list a { color: var(--x-ink); text-decoration: underline; text-underline-offset: 3px; }
        .contact-form { display: flex; flex-direction: column; gap: 18px; padding: 36px; border-radius: var(--x-radius); background: var(--x-white); border: 1px solid var(--x-line); box-shadow: var(--x-shadow); }
        .contact-form .field { display: flex; flex-direction: column; gap: 8px; }
        .contact-form label { font-size: .8rem; font-weight: 600; letter-spacing: .04em; color: var(--x-muted); }
        .contact-form input, .contact-form select, .contact-form textarea {
            width: 100%; padding: 13px 14px; border: 1px solid var(--x-line-strong); border-radius: 8px;
            background: var(--x-white); font: inherit; color: var(--x-ink); transition: border-color .2s, box-shadow .2s;
        }
        .contact-form input:focus, .contact-form select:focus, .contact-form textarea:focus {
            outline: none; border-color: var(--x-ink); box-shadow: var(--x-ring);
        }
        .contact-form textarea { resize: vertical; min-height: 120px; }
        .contact-form button { align-self: flex-start; }

        /* ---------- footer ---------- */
        .site-footer { background: var(--x-light); color: var(--x-ink-2); padding: 72px 0 36px; border-top: 1px solid var(--x-line); }
        .footer-top { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 40px; }
        .footer-top h4 { color: var(--x-ink); font-size: .82rem; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 18px; }
        .footer-top a { display: block; padding: 5px 0; color: var(--x-ink-2); font-size: .92rem; }
        .footer-top a:hover { color: var(--x-ink); }
        .footer-brand .brand { color: var(--x-ink); margin-bottom: 14px; }
        .footer-brand p { color: var(--x-muted); font-size: .92rem; max-width: 38ch; }
        .footer-bottom { margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--x-line); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: .84rem; color: var(--x-muted); }

        /* language switcher (dropdown + globe) */
        .lang-switch { position: relative; }
        .lang-toggle {
            list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
            padding: 7px 13px; border-radius: 8px; border: 1px solid var(--x-line-strong);
            background: var(--x-white); color: var(--x-ink-2); font-size: .85rem; font-weight: 600;
            transition: border-color .2s, color .2s, box-shadow .2s;
        }
        .lang-toggle::-webkit-details-marker { display: none; }
        .lang-toggle:hover { border-color: var(--x-ink); color: var(--x-ink); }
        .lang-globe, .lang-chevron { width: 16px; height: 16px; flex: none; }
        .lang-chevron { transition: transform .25s; }
        .lang-switch[open] .lang-toggle { border-color: var(--x-ink); color: var(--x-ink); box-shadow: var(--x-ring); }
        .lang-switch[open] .lang-chevron { transform: rotate(180deg); }
        .lang-menu {
            position: absolute; top: calc(100% + 8px); right: 0; min-width: 124px;
            background: var(--x-white); border: 1px solid var(--x-line); border-radius: 8px;
            box-shadow: var(--x-shadow); padding: 6px; display: flex; flex-direction: column; gap: 2px; z-index: 60;
        }
        .lang-menu a { padding: 9px 12px; border-radius: 6px; font-size: .88rem; color: var(--x-ink-2); }
        .lang-menu a:hover { background: var(--x-light); color: var(--x-ink); }
        .lang-menu a.active { color: var(--x-ink); font-weight: 600; }

        /* ---------- scroll reveal ---------- */
        [data-reveal] { opacity: 0; transform: translateY(26px); transition: opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1); }
        [data-reveal].is-visible { opacity: 1; transform: none; }
        @media (prefers-reduced-motion: reduce) {
            [data-reveal] { opacity: 1; transform: none; transition: none; }
            .stage .halo, .motor-vis .core, .motor-vis .ring.b { animation: none; }
            html { scroll-behavior: auto; }
        }

        /* ---------- pagination ---------- */
        .pagination { display: flex; align-items: center; gap: 18px; margin-top: 40px; }
        .pagination span { color: var(--x-muted); }

        /* detail rich text */
        .rich-text { max-width: 760px; }
        .rich-text :is(h2,h3) { margin-top: 1.4em; color: var(--x-ink); }
        .rich-text p { margin: .8em 0; color: var(--x-muted); }
        .back-link { margin-top: 40px; font-weight: 600; }

        /* ---------- Tablet ---------- */
        @media (max-width: 1023px) {
            .section { padding: 80px 0; }
            .hero { padding: 104px 0 72px; }
            .hero .container { grid-template-columns: 1fr; gap: 40px; }
            .hero .stage { max-width: 460px; margin: 0 auto; }
            .cat-grid { grid-template-columns: 1fr 1fr; }
            .motor-grid { grid-template-columns: 1fr; gap: 36px; }
            .motor-vis { max-width: 420px; margin: 0 auto; }
            .p-block { grid-template-columns: 1fr; gap: 36px; }
            .p-block.flip .p-media { order: 0; }
            .p-media .stage { max-width: 520px; margin: 0 auto; }
            .contact-grid { grid-template-columns: 1fr; }
            .footer-top { grid-template-columns: 1fr 1fr; }
        }
        /* ---------- Mobile ---------- */
        @media (max-width: 639px) {
            :root { --x-pad: 18px; }
            .section { padding: 64px 0; }
            .section-head { margin-bottom: 36px; }
            .nav-toggle { display: block; }
            .site-nav {
                display: none; position: absolute; top: 68px; left: 0; right: 0;
                flex-direction: column; align-items: flex-start; gap: 0;
                background: var(--x-white); border-bottom: 1px solid var(--x-line);
                padding: 12px var(--x-pad) 22px;
            }
            .site-nav a { width: 100%; padding: 13px 0; border-bottom: 1px solid var(--x-line); font-size: 1rem; }
            .site-nav a.active::after { display: none; }
            .header-inner.open .site-nav { display: flex; }
            .nav-cta { margin: 10px 0 0; }
            .lang-toggle { width: 100%; justify-content: flex-start; margin-top: 10px; }
            .lang-menu { position: static; box-shadow: none; border: 0; padding: 0 0 0 22px; min-width: 0; }
            .lang-menu a { border-bottom: 1px solid var(--x-line); border-radius: 0; }
            .cat-grid { grid-template-columns: 1fr; }
            .news-grid { grid-template-columns: 1fr; }
            .hero-specs { gap: 24px; }
            .stat-row { gap: 28px; }
            .cta-band .container { flex-direction: column; align-items: flex-start; }
            .contact-form { padding: 26px; }
            .footer-top { grid-template-columns: 1fr; gap: 28px; }
        }
    </style>
</head>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- xhope 顶部导航:深色玻璃态。active 高亮当前页。 -->
<header th:fragment="header(siteName, active)" class="site-header">
    <div class="container header-inner">
        <a class="brand" th:href="@{${localePrefix + '/'}}">
<!--            <span class="dot"></span>-->
            <span th:text="${siteName}">XHOPE</span>
            <small th:text="#{brand.tagline}">Home Cleaning Engineering</small>
        </a>
        <button class="nav-toggle" aria-label="Toggle menu"
                onclick="this.parentElement.classList.toggle('open')">&#9776;</button>
        <nav class="site-nav">
            <a th:href="@{${localePrefix + '/'}}" th:text="#{nav.home}" th:classappend="${active == 'index'} ? 'active' : ''">Home</a>
            <a th:href="@{${localePrefix + '/products'}}" th:text="#{nav.products}" th:classappend="${active == 'products'} ? 'active' : ''">Products</a>
            <a th:href="@{${localePrefix + '/news'}}" th:text="#{nav.news}" th:classappend="${active == 'news'} ? 'active' : ''">News</a>
            <a th:href="@{${localePrefix + '/contact'}}" th:text="#{nav.contact}" th:classappend="${active == 'contact'} ? 'active' : ''">Contact</a>
            <th:block th:replace="~{themes/xhope/fragments/language :: language(current=${currentLanguage}, languages=${languages})}"></th:block>
            <a class="btn btn-accent nav-cta" th:href="@{${localePrefix + '/contact'}}" th:text="#{home.cta.btn}">Contact</a>
        </nav>
    </div>
</header>
</html>

<!DOCTYPE html>
<html th:lang="${currentLanguage}" th:dir="${currentLanguage == 'ar-SA' ? 'rtl' : 'ltr'}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{themes/xhope/fragments/head :: head(pageTitle=${pageTitle}, pageDescription=${pageDescription}, pageKeywords=${pageKeywords}, canonical=${canonical}, robots=${robots}, siteName=${siteName})}"></head>
<body>
<header th:replace="~{themes/xhope/fragments/header :: header(siteName=${siteName}, active='media')}"></header>

<style>
    /* 媒体中心页:图片网格 + 灯箱 + 视频。黑白灰、直角,沿用 design tokens。 */
    .media-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 16px;
    }
    .media-tile {
        position: relative;
        display: block;
        aspect-ratio: 4 / 3;
        overflow: hidden;
        background: var(--x-tint);
        border: 1px solid var(--x-line);
        cursor: zoom-in;
        padding: 0;
    }
    .media-tile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform .4s ease;
    }
    .media-tile:hover img { transform: scale(1.04); }
    .media-tile .tile-name {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        padding: 8px 12px;
        font-size: 12px;
        color: var(--x-white);
        background: linear-gradient(to top, rgba(10,10,10,.78), transparent);
        letter-spacing: .02em;
    }

    .video-tile {
        position: relative;
        background: var(--x-ink);
        border: 1px solid var(--x-line-strong);
    }
    .video-tile video {
        width: 100%;
        display: block;
        aspect-ratio: 16 / 9;
        background: var(--x-black);
        object-fit: cover;
    }
    .video-tile .tile-name {
        padding: 10px 14px;
        font-size: 13px;
        color: var(--x-light);
        border-top: 1px solid #2a2a2e;
    }

    /* 灯箱 */
    .lightbox {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: rgba(10,10,10,.92);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 32px;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        display: block;
        box-shadow: 0 24px 80px rgba(0,0,0,.5);
    }
    .lightbox-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 44px; height: 44px;
        display: flex; align-items: center; justify-content: center;
        background: transparent;
        border: 1px solid rgba(255,255,255,.25);
        color: var(--x-white);
        font-size: 22px;
        cursor: pointer;
    }
    .lightbox-btn:hover { background: rgba(255,255,255,.08); }
    .lightbox-btn.prev { left: 16px; }
    .lightbox-btn.next { right: 16px; }
    .lightbox-close {
        position: absolute;
        top: 16px; right: 16px;
        font-size: 26px;
        color: var(--x-white);
        background: transparent;
        border: 0;
        cursor: pointer;
        line-height: 1;
    }
    .lightbox-caption {
        position: absolute;
        left: 0; right: 0; bottom: 18px;
        text-align: center;
        color: var(--x-faint);
        font-size: 13px;
    }
    @media (max-width: 640px) {
        .media-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .lightbox { padding: 12px; }
        .lightbox-btn { width: 38px; height: 38px; font-size: 18px; }
    }
</style>

<!-- ===================== MEDIA HERO ===================== -->
<section class="section section--alt" style="padding-top:128px">
    <div class="container section-head" data-reveal style="margin-bottom:0">
        <p class="eyebrow" th:text="#{media.eyebrow}">MEDIA CENTER</p>
        <h2 th:text="#{media.title}">Gallery &amp; videos</h2>
        <p th:text="#{media.lead}">Product imagery and cleaning technology in motion.</p>
    </div>
</section>

<!-- ===================== IMAGE GALLERY ===================== -->
<section class="section section--light">
    <div class="container">
        <div class="section-head" data-reveal>
            <p class="eyebrow" th:text="#{media.images}">Image gallery</p>
        </div>
        <div class="media-grid">
            <button type="button" class="media-tile" data-full="/themes-images/xhope/images/products/v1/tp.jpeg" data-index="0" onclick="xhopeLightbox.open(this)">
                <img th:src="@{/themes-images/xhope/images/products/v1/tp.jpeg}" alt="tp" loading="lazy" />
                <span class="tile-name">tp</span>
            </button>
            <button type="button" class="media-tile" data-full="/themes-images/xhope/images/products/v1/v3.png" data-index="1" onclick="xhopeLightbox.open(this)">
                <img th:src="@{/themes-images/xhope/images/products/v1/v3.png}" alt="v3" loading="lazy" />
                <span class="tile-name">v3</span>
            </button>
            <button type="button" class="media-tile" data-full="/themes-images/xhope/images/products/v1/v4.png" data-index="2" onclick="xhopeLightbox.open(this)">
                <img th:src="@{/themes-images/xhope/images/products/v1/v4.png}" alt="v4" loading="lazy" />
                <span class="tile-name">v4</span>
            </button>
        </div>
    </div>
</section>

<!-- ===================== VIDEO GALLERY ===================== -->
<section class="section section--alt">
    <div class="container">
        <div class="section-head" data-reveal>
            <p class="eyebrow" th:text="#{media.videos}">Video gallery</p>
        </div>
        <div class="media-grid">
            <figure class="video-tile" data-reveal>
                <video controls preload="metadata" playsinline>
                    <source th:src="@{/themes-images/xhope/images/media/Ocean-Engineering.mp4}" />
                </video>
                <figcaption class="tile-name">Ocean-Engineering</figcaption>
            </figure>
            <figure class="video-tile" data-reveal>
                <video controls preload="metadata" playsinline>
                    <source th:src="@{/themes-images/xhope/images/media/mov_bbb.mp4}" />
                </video>
                <figcaption class="tile-name">mov_bbb</figcaption>
            </figure>
        </div>
    </div>
</section>

<!-- ===================== LIGHTBOX ===================== -->
<div class="lightbox" id="xhopeLightbox" role="dialog" aria-modal="true" aria-label="Image viewer"
     onclick="if(event.target===this)xhopeLightbox.close()">
    <button class="lightbox-close" type="button" aria-label="Close" onclick="xhopeLightbox.close()">&times;</button>
    <button class="lightbox-btn prev" type="button" aria-label="Previous" onclick="xhopeLightbox.step(-1)">&#8249;</button>
    <img alt="" />
    <button class="lightbox-btn next" type="button" aria-label="Next" onclick="xhopeLightbox.step(1)">&#8250;</button>
    <div class="lightbox-caption"></div>
</div>

<script>
    (function () {
        var box = document.getElementById('xhopeLightbox');
        var img = box.querySelector('img');
        var cap = box.querySelector('.lightbox-caption');
        var items = []; // [{url,name}]

        function collect() {
            items = [];
            box.parentElement.querySelectorAll('.media-tile[data-full]').forEach(function (t) {
                items.push({
                    url: t.getAttribute('data-full'),
                    name: t.querySelector('.tile-name') ? t.querySelector('.tile-name').textContent : ''
                });
            });
        }
        var i = 0;
        function render() {
            if (!items.length) return;
            img.src = items[i].url;
            img.alt = items[i].name;
            cap.textContent = (i + 1) + ' / ' + items.length + (items[i].name ? '  ·  ' + items[i].name : '');
        }
        window.xhopeLightbox = {
            open: function (tile) {
                collect();
                var idx = parseInt(tile.getAttribute('data-index') || '0', 10);
                i = isNaN(idx) ? 0 : Math.max(0, Math.min(idx, items.length - 1));
                render();
                box.classList.add('open');
                document.body.style.overflow = 'hidden';
            },
            close: function () {
                box.classList.remove('open');
                img.src = '';
                document.body.style.overflow = '';
            },
            step: function (d) {
                if (!items.length) return;
                i = (i + d + items.length) % items.length;
                render();
            }
        };
        document.addEventListener('keydown', function (e) {
            if (!box.classList.contains('open')) return;
            if (e.key === 'Escape') xhopeLightbox.close();
            else if (e.key === 'ArrowLeft') xhopeLightbox.step(-1);
            else if (e.key === 'ArrowRight') xhopeLightbox.step(1);
        });
    })();
</script>

<footer th:replace="~{themes/xhope/fragments/footer :: footer(siteName=${siteName}, config=${config})}"></footer>
</body>
</html>
